# The CLI pushes OTLP over HTTP; the collector batches and exposes the metrics for Prometheus.
# Series expire 30 days after their last update, so a run's last values stay scrapeable
# between daily runs (gauges are per stage; a new run overwrites them).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    metric_expiration: 720h
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
