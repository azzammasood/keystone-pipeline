global:
  scrape_interval: 15s

scrape_configs:
  - job_name: keystone  # pipeline metrics, via the OpenTelemetry collector
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: otel-collector  # the collector's own metrics
    static_configs:
      - targets: ["otel-collector:8888"]
