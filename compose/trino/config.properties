# Single node (coordinator also schedules work). Heap is 80% of the 1536m container limit
# (about 1.2 GB); the default per-node query memory (30% of heap, 357 MB) was too small for the
# fingerprint's distinct counts on 800k-row tables (measured 2026-10-20), so queries get 768 MB
# and the default 30% heap headroom stays.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
query.max-memory=768MB
query.max-memory-per-node=768MB
