# Local-mode reader of the Lakekeeper catalog (same settings as Flink's `ice` catalog).
spark.master                                  local[2]
spark.driver.memory                           768m
spark.ui.enabled                              false
spark.sql.session.timeZone                    UTC
spark.sql.extensions                          org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.ice                         org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.ice.type                    rest
spark.sql.catalog.ice.uri                     http://lakekeeper:8181/catalog
spark.sql.catalog.ice.warehouse               keystone
spark.sql.catalog.ice.io-impl                 org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.ice.s3.endpoint             http://rustfs:9000
spark.sql.catalog.ice.s3.path-style-access    true
spark.sql.catalog.ice.client.region           local-01
# OpenLineage (Phase 6): events to the mounted /lineage directory; `keystone lineage collect`
# canonicalises them into the event log.
spark.extraListeners                          io.openlineage.spark.agent.OpenLineageSparkListener
spark.openlineage.transport.type              file
spark.openlineage.transport.location          /lineage/spark.jsonl
spark.openlineage.namespace                   keystone
