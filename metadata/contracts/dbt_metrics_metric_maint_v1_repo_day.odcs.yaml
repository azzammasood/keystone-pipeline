apiVersion: v3.1.0
kind: DataContract
id: keystone-dbt-metrics-metric-maint-v1-repo-day
name: metrics.metric_maint_v1_repo_day
version: 1.0.0
status: active
domain: activity
tags:
- layer:published
- classification:public
description:
  purpose: maint_v1 inputs per repository and UTC day, E1 and E2 (merged flag present).
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 26
  unit: h
servers:
- server: local
  type: duckdb
  database: data/warehouse/keystone.duckdb
  schema: metrics
schema:
- name: metric_maint_v1_repo_day
  physicalName: metric_maint_v1_repo_day
  physicalType: table
  logicalType: object
  description: maint_v1 inputs per repository and UTC day, E1 and E2 (merged flag present).
  properties:
  - name: activity_date
    logicalType: date
    physicalType: DATE
    description: UTC day.
  - name: repo_id
    logicalType: integer
    physicalType: BIGINT
    description: GitHub repository id.
    required: true
  - name: era
    logicalType: string
    physicalType: VARCHAR
    description: Schema era (E1 or E2).
  - name: completeness_period
    logicalType: string
    physicalType: VARCHAR
    description: Completeness period.
  - name: metric_version
    logicalType: string
    physicalType: VARCHAR
    description: maint_v1.
  - name: prs_opened
    logicalType: integer
    physicalType: BIGINT
    description: Pull requests opened.
  - name: prs_closed
    logicalType: integer
    physicalType: BIGINT
    description: Pull requests closed.
  - name: prs_merged
    logicalType: integer
    physicalType: BIGINT
    description: Closed pull requests marked merged.
  - name: pr_merge_known
    logicalType: integer
    physicalType: BIGINT
    description: Closed pull requests whose merged flag is present.
  - name: issues_opened
    logicalType: integer
    physicalType: BIGINT
    description: Issues opened.
  - name: issues_closed
    logicalType: integer
    physicalType: BIGINT
    description: Issues closed.
  - name: releases_published
    logicalType: integer
    physicalType: BIGINT
    description: Releases published.
