apiVersion: v3.1.0
kind: DataContract
id: keystone-registry-quarantine
name: Registry quarantine
version: 1.0.0
status: active
domain: operations
tags:
- layer:silver
- classification:internal
description:
  purpose: Registry records that could not be used, with a reason; no record content.
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 26
  unit: h
servers:
- server: local
  type: local
  format: parquet
  path: data/quarantine/registry/*.parquet
schema:
- name: registry
  physicalName: registry
  physicalType: table
  logicalType: object
  description: Registry records that could not be used, with a reason; no record content.
  properties:
  - name: source_file
    logicalType: string
    physicalType: STRING
    description: Source file the row came from (`osv/<ecosystem>/all.zip` for OSV).
    required: true
  - name: source_sha256
    logicalType: string
    physicalType: STRING
    description: SHA-256 of the verified source file.
    required: true
  - name: fetched_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the source file was fetched (UTC).
    required: true
  - name: source
    logicalType: string
    physicalType: STRING
    description: ecosystems or npm_registry.
    required: true
  - name: package_key
    logicalType: string
    physicalType: STRING
    description: Package the record was for, when known.
  - name: reason
    logicalType: string
    physicalType: STRING
    description: Why the record could not be used.
    required: true
