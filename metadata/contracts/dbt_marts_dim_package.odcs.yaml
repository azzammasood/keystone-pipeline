apiVersion: v3.1.0
kind: DataContract
id: keystone-dbt-marts-dim-package
name: marts.dim_package
version: 1.0.0
status: active
domain: packages
tags:
- layer:published
- classification:public
description:
  purpose: One row per package named in OSV (ecosystem and name as OSV spells them).
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 48
  unit: h
servers:
- server: local
  type: duckdb
  database: data/warehouse/keystone.duckdb
  schema: marts
schema:
- name: dim_package
  physicalName: dim_package
  physicalType: table
  logicalType: object
  description: One row per package named in OSV (ecosystem and name as OSV spells them).
  properties:
  - name: package_key
    logicalType: string
    physicalType: VARCHAR
    description: ecosystem/package_name.
    required: true
  - name: ecosystem
    logicalType: string
    physicalType: VARCHAR
    description: OSV ecosystem.
  - name: package_name
    logicalType: string
    physicalType: VARCHAR
    description: Package name.
  - name: purl
    logicalType: string
    physicalType: VARCHAR
    description: A package URL from OSV, if any.
  - name: vuln_count
    logicalType: integer
    physicalType: BIGINT
    description: OSV records naming the package.
  - name: malicious_vuln_count
    logicalType: integer
    physicalType: BIGINT
    description: Of those, malicious-package reports.
  - name: withdrawn_vuln_count
    logicalType: integer
    physicalType: BIGINT
    description: Of those, withdrawn records.
  - name: first_vuln_published_at
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: Earliest publication time among those records, UTC.
  - name: last_vuln_modified_at
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: Latest modification time among those records, UTC.
