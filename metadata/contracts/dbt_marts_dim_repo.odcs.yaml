apiVersion: v3.1.0
kind: DataContract
id: keystone-dbt-marts-dim-repo
name: marts.dim_repo
version: 1.0.0
status: active
domain: activity
tags:
- layer:published
- classification:public
description:
  purpose: One row per GitHub repository id seen in GH Archive, with its current name.
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 26
  unit: h
servers:
- server: local
  type: duckdb
  database: data/warehouse/keystone.duckdb
  schema: marts
schema:
- name: dim_repo
  physicalName: dim_repo
  physicalType: table
  logicalType: object
  description: One row per GitHub repository id seen in GH Archive, with its current name.
  properties:
  - name: repo_id
    logicalType: integer
    physicalType: BIGINT
    description: GitHub repository id.
    required: true
  - name: repo_name
    logicalType: string
    physicalType: VARCHAR
    description: Current name, the latest name spell in dim_repo_name_history.
    required: true
  - name: repo_name_lower
    logicalType: string
    physicalType: VARCHAR
    description: Current name in lower case (GitHub names are case-insensitive).
  - name: distinct_names
    logicalType: integer
    physicalType: BIGINT
    description: Distinct names (case-insensitive) the id has carried.
  - name: name_spells
    logicalType: integer
    physicalType: BIGINT
    description: Name spells in the history (a name taken again counts again; case changes do not).
  - name: first_seen_at
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: First event of the repository, UTC.
  - name: last_seen_at
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: Last event of the repository, UTC.
  - name: first_era
    logicalType: string
    physicalType: VARCHAR
    description: Earliest schema era with an event.
  - name: last_era
    logicalType: string
    physicalType: VARCHAR
    description: Latest schema era with an event.
  - name: events
    logicalType: integer
    physicalType: BIGINT
    description: Events with a repository id (all eras in the loaded data).
