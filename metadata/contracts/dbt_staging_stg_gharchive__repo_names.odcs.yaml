apiVersion: v3.1.0
kind: DataContract
id: keystone-dbt-staging-stg-gharchive--repo-names
name: staging.stg_gharchive__repo_names
version: 1.0.0
status: active
domain: activity
tags:
- layer:warehouse
- classification:public
description:
  purpose: Repository id, name, era and time of each silver event that carries a name.
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 26
  unit: h
servers:
- server: local
  type: duckdb
  database: data/warehouse/keystone.duckdb
  schema: staging
schema:
- name: stg_gharchive__repo_names
  physicalName: stg_gharchive__repo_names
  physicalType: table
  logicalType: object
  description: Repository id, name, era and time of each silver event that carries a name.
  properties:
  - name: repo_id
    logicalType: integer
    physicalType: BIGINT
    description: GitHub repository id; null where the era has none (E1 2012, some E0).
  - name: repo_name
    logicalType: string
    physicalType: VARCHAR
    description: Repository full name (owner/name) as the event spelled it.
    required: true
  - name: era
    logicalType: string
    physicalType: VARCHAR
    description: Schema era of the source file of the event.
  - name: created_at
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: Event time, UTC.
