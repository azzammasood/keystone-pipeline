apiVersion: v3.1.0
kind: DataContract
id: keystone-osv-quarantine
name: OSV quarantine
version: 1.0.0
status: active
domain: operations
tags:
- layer:silver
- classification:internal
description:
  purpose: OSV records that could not be parsed, with a reason; no record content.
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 26
  unit: h
servers:
- server: local
  type: local
  format: parquet
  path: data/quarantine/osv/*.parquet
schema:
- name: quarantine
  physicalName: quarantine
  physicalType: table
  logicalType: object
  description: OSV records that could not be parsed, with a reason; no record content.
  properties:
  - name: source_file
    logicalType: string
    physicalType: STRING
    description: Source file the row came from (`osv/<ecosystem>/all.zip` for OSV).
    required: true
  - name: source_sha256
    logicalType: string
    physicalType: STRING
    description: SHA-256 of the verified source file.
    required: true
  - name: fetched_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the source file was fetched (UTC).
    required: true
  - name: source_member
    logicalType: string
    physicalType: STRING
    description: Member of the zip the record came from.
    required: true
  - name: reason
    logicalType: string
    physicalType: STRING
    description: Why the record could not be parsed.
    required: true
  - name: member_sha256
    logicalType: string
    physicalType: STRING
    description: SHA-256 of the zip member.
    required: true
  - name: member_bytes
    logicalType: integer
    physicalType: INT64
    description: Size of the zip member in bytes.
    required: true
