apiVersion: v3.1.0
kind: DataContract
id: keystone-dbt-staging-stg-osv--repo-refs
name: staging.stg_osv__repo_refs
version: 1.0.0
status: active
domain: packages
tags:
- layer:warehouse
- classification:public
description:
  purpose: Repository pointers in OSV records.
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 48
  unit: h
servers:
- server: local
  type: duckdb
  database: data/warehouse/keystone.duckdb
  schema: staging
schema:
- name: stg_osv__repo_refs
  physicalName: stg_osv__repo_refs
  physicalType: table
  logicalType: object
  description: Repository pointers in OSV records.
  properties:
  - name: vuln_id
    logicalType: string
    physicalType: VARCHAR
    description: OSV id.
  - name: affected_index
    logicalType: integer
    physicalType: BIGINT
    description: Affected entry of a GIT range; null for FIX references (whole record).
  - name: kind
    logicalType: string
    physicalType: VARCHAR
    description: git_range or fix_reference.
  - name: url
    logicalType: string
    physicalType: VARCHAR
    description: The URL as given.
  - name: repo_host
    logicalType: string
    physicalType: VARCHAR
    description: github.com, gitlab.com or bitbucket.org.
  - name: repo_full_name
    logicalType: string
    physicalType: VARCHAR
    description: owner/name in lower case.
