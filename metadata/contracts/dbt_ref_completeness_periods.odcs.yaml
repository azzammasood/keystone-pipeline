apiVersion: v3.1.0
kind: DataContract
id: keystone-dbt-ref-completeness-periods
name: ref.completeness_periods
version: 1.0.0
status: active
domain: operations
tags:
- layer:reference
- classification:public
description:
  purpose: GH Archive completeness periods (ADR-012), copied from config/sources.yml; a pytest test fails
    if the two differ.
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 720
  unit: h
servers:
- server: local
  type: duckdb
  database: data/warehouse/keystone.duckdb
  schema: ref
schema:
- name: completeness_periods
  physicalName: completeness_periods
  physicalType: table
  logicalType: object
  description: GH Archive completeness periods (ADR-012), copied from config/sources.yml; a pytest test
    fails if the two differ.
  properties:
  - name: period
    logicalType: string
    physicalType: VARCHAR
    description: Period name (C1, C2, GAP, C3, C4, C5).
    required: true
  - name: label
    logicalType: string
    physicalType: VARCHAR
    description: Short description of the capture level in the period.
  - name: start_at
    logicalType: string
    physicalType: VARCHAR
    description: First UTC hour of the period (ISO 8601 text).
