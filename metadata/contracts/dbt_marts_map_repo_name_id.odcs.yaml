apiVersion: v3.1.0
kind: DataContract
id: keystone-dbt-marts-map-repo-name-id
name: marts.map_repo_name_id
version: 1.0.0
status: active
domain: activity
tags:
- layer:published
- classification:public
description:
  purpose: 'GH Archive events with a repository name but no id (E1 2012, some E0), resolved by name: one
    row per name and UTC hour with the chosen id, status, rule and confidence.'
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 26
  unit: h
servers:
- server: local
  type: duckdb
  database: data/warehouse/keystone.duckdb
  schema: marts
schema:
- name: map_repo_name_id
  physicalName: map_repo_name_id
  physicalType: table
  logicalType: object
  description: 'GH Archive events with a repository name but no id (E1 2012, some E0), resolved by name:
    one row per name and UTC hour with the chosen id, status, rule and confidence.'
  properties:
  - name: repo_name_lower
    logicalType: string
    physicalType: VARCHAR
    description: owner/name in lower case.
    required: true
  - name: event_hour
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: UTC hour of the events.
  - name: era
    logicalType: string
    physicalType: VARCHAR
    description: Schema era of the events (E0 or E1).
  - name: events
    logicalType: integer
    physicalType: BIGINT
    description: Events of that name and hour without an id.
  - name: repo_id
    logicalType: integer
    physicalType: BIGINT
    description: Chosen GitHub repository id (nearest candidate for suggested rows).
  - name: id_existed
    logicalType: boolean
    physicalType: BOOLEAN
    description: The chosen id is no larger than an id seen in an event before the hour.
  - name: candidate_ids
    logicalType: integer
    physicalType: BIGINT
    description: Ids GH Archive saw with the name.
  - name: gap_hours
    logicalType: integer
    physicalType: BIGINT
    description: Hours between the events and the chosen id's nearest spell of the name (0 inside it).
  - name: status
    logicalType: string
    physicalType: VARCHAR
    description: auto_exact, accepted, suggested or rejected.
  - name: rule
    logicalType: string
    physicalType: VARCHAR
    description: 'review, spell_covers, unique_name_near, unique_name_id_existed, unique_name_far or several_ids
      (see the model''s header and ADR-037).

      '
  - name: confidence
    logicalType: string
    physicalType: VARCHAR
    description: high, medium or low.
