apiVersion: v3.1.0
kind: DataContract
id: keystone-dbt-ref-resolve-decisions
name: ref.resolve_decisions
version: 1.0.0
status: active
domain: packages
tags:
- layer:reference
- classification:public
description:
  purpose: 'Reviewed resolution decisions (Phase 7, ADR-037): an owner or corrections request accepts
    or rejects a candidate from the review CSV. A decision overrides every rule on the next build. Repository
    and package level only.'
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 8760
  unit: h
servers:
- server: local
  type: duckdb
  database: data/warehouse/keystone.duckdb
  schema: ref
schema:
- name: resolve_decisions
  physicalName: resolve_decisions
  physicalType: table
  logicalType: object
  description: 'Reviewed resolution decisions (Phase 7, ADR-037): an owner or corrections request accepts
    or rejects a candidate from the review CSV. A decision overrides every rule on the next build. Repository
    and package level only.'
  properties:
  - name: subject
    logicalType: string
    physicalType: VARCHAR
    description: package_repo (a package's repository) or repo_name_id (a name without an id).
  - name: subject_key
    logicalType: string
    physicalType: VARCHAR
    description: package_key (ecosystem/normalised name) or the repository name in lower case.
    required: true
  - name: candidate
    logicalType: string
    physicalType: VARCHAR
    description: The candidate decided on, as the review CSV lists it (repo_key or repo id).
    required: true
  - name: decision
    logicalType: string
    physicalType: VARCHAR
    description: accepted or rejected.
  - name: decided_on
    logicalType: string
    physicalType: VARCHAR
    description: Date of the decision (ISO 8601, UTC).
  - name: note
    logicalType: string
    physicalType: VARCHAR
    description: Why, in a few words (no personal data).
