apiVersion: v3.1.0
kind: DataContract
id: keystone-rollup-repo-actor-day
name: Rollup repo_actor_day (free engine)
version: 1.0.0
status: active
domain: activity
tags:
- layer:rollup
- classification:pseudonymous
description:
  purpose: Maintenance actions per repository, salted actor key, era and UTC day; bots excluded. Internal
    input of bus-factor shares; never published.
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 26
  unit: h
servers:
- server: local
  type: duckdb
  database: data/rollup/rollup.duckdb
  schema: main
schema:
- name: repo_actor_day
  physicalName: repo_actor_day
  physicalType: table
  logicalType: object
  description: Maintenance actions per repository, salted actor key, era and UTC day; bots excluded. Internal
    input of bus-factor shares; never published.
  properties:
  - name: window_start
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: Start of the UTC day.
  - name: repo_id
    logicalType: integer
    physicalType: BIGINT
    description: GitHub repository id.
  - name: actor_key
    logicalType: string
    physicalType: VARCHAR
    description: Salted key of the account (ADR-019); internal, never published.
  - name: actor_key_kind
    logicalType: string
    physicalType: VARCHAR
    description: Whether the key hashes an account id or a login (E1).
  - name: era
    logicalType: string
    physicalType: VARCHAR
    description: Schema era of the events.
  - name: events
    logicalType: integer
    physicalType: BIGINT
    description: Events by the account in the repository that day.
  - name: pushes
    logicalType: integer
    physicalType: BIGINT
    description: Push events.
  - name: prs_opened
    logicalType: integer
    physicalType: BIGINT
    description: Pull requests opened.
  - name: prs_closed
    logicalType: integer
    physicalType: BIGINT
    description: Pull requests closed.
  - name: prs_merged
    logicalType: integer
    physicalType: BIGINT
    description: Pull requests closed as merged (the merged flag exists in E1, E2 only).
  - name: issues_opened
    logicalType: integer
    physicalType: BIGINT
    description: Issues opened.
  - name: issues_closed
    logicalType: integer
    physicalType: BIGINT
    description: Issues closed.
  - name: releases
    logicalType: integer
    physicalType: BIGINT
    description: Releases published.
  - name: members_added
    logicalType: integer
    physicalType: BIGINT
    description: Members added.
  - name: comments
    logicalType: integer
    physicalType: BIGINT
    description: Issue comments, pull-request reviews and review comments, commit comments.
  - name: fetched_at_max
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: Newest fetch time of the contributing source files (UTC).
