apiVersion: v3.1.0
kind: DataContract
id: keystone-dbt-marts-map-package-repo
name: marts.map_package_repo
version: 1.0.0
status: active
domain: packages
tags:
- layer:published
- classification:public
description:
  purpose: 'Package to repository mapping (Phase 7, ADR-037): one row per package and candidate repository
    with status (auto_exact, accepted, suggested, rejected), the rule that decided it and a confidence.
    Only exact matches (two independent sources, no rival) are auto_exact; ambiguous cases follow documented
    rules; suggested rows go to the review CSV.'
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 48
  unit: h
servers:
- server: local
  type: duckdb
  database: data/warehouse/keystone.duckdb
  schema: marts
schema:
- name: map_package_repo
  physicalName: map_package_repo
  physicalType: table
  logicalType: object
  description: 'Package to repository mapping (Phase 7, ADR-037): one row per package and candidate repository
    with status (auto_exact, accepted, suggested, rejected), the rule that decided it and a confidence.
    Only exact matches (two independent sources, no rival) are auto_exact; ambiguous cases follow documented
    rules; suggested rows go to the review CSV.'
  properties:
  - name: package_key
    logicalType: string
    physicalType: VARCHAR
    description: ecosystem/name normalised (PEP 503 for PyPI).
    required: true
  - name: ecosystem
    logicalType: string
    physicalType: VARCHAR
    description: Ecosystem in OSV spelling.
  - name: package_name
    logicalType: string
    physicalType: VARCHAR
    description: Package name as the registry or OSV spells it.
  - name: package_scope
    logicalType: string
    physicalType: VARCHAR
    description: critical, osv, osv_malware_only or registry_only (int_package_universe).
  - name: repo_key
    logicalType: string
    physicalType: VARCHAR
    description: Candidate key, github.com#<id> when the GitHub id is known, else host/owner/name.
    required: true
  - name: repo_host
    logicalType: string
    physicalType: VARCHAR
    description: github.com, gitlab.com or bitbucket.org.
  - name: repo_full_name
    logicalType: string
    physicalType: VARCHAR
    description: Current owner/name in lower case (renames followed when the id is known).
  - name: repo_id
    logicalType: integer
    physicalType: BIGINT
    description: GitHub repository id, or null when it is not known.
  - name: repo_id_rule
    logicalType: string
    physicalType: VARCHAR
    description: How the id was found (int_repo_identity.id_rule).
  - name: seen_in_gharchive
    logicalType: boolean
    physicalType: BOOLEAN
    description: The repository id appears in the loaded GH Archive data.
  - name: claimed_names
    logicalType: integer
    physicalType: BIGINT
    description: Distinct names the claims used for this repository (more than 1 after a rename).
  - name: by_ecosystems
    logicalType: boolean
    physicalType: BOOLEAN
    description: ecosyste.ms names this repository.
  - name: by_npm_registry
    logicalType: boolean
    physicalType: BOOLEAN
    description: The npm registry `repository` field names it.
  - name: by_osv_git_range
    logicalType: boolean
    physicalType: BOOLEAN
    description: An OSV GIT range of the package names it.
  - name: by_osv_fix_sole
    logicalType: boolean
    physicalType: BOOLEAN
    description: A FIX reference in an OSV record about this package only names it.
  - name: by_osv_fix_shared
    logicalType: boolean
    physicalType: BOOLEAN
    description: A FIX reference in an OSV record about several packages names it.
  - name: in_subpath
    logicalType: boolean
    physicalType: BOOLEAN
    description: A claim names a directory inside the repository (monorepo package).
  - name: osv_evidence_vulns
    logicalType: integer
    physicalType: BIGINT
    description: OSV records giving evidence for this candidate.
  - name: independent_sources
    logicalType: integer
    physicalType: BIGINT
    description: 'Independent source families naming it (0 to 2): the registry (npm registry field or
      ecosyste.ms, which derives from it) and an OSV GIT range.'
  - name: candidates
    logicalType: integer
    physicalType: BIGINT
    description: Candidate repositories of the package.
  - name: status
    logicalType: string
    physicalType: VARCHAR
    description: auto_exact, accepted, suggested or rejected.
    required: true
  - name: rule
    logicalType: string
    physicalType: VARCHAR
    description: The documented rule that set the status (see the model's header and ADR-037).
  - name: confidence
    logicalType: string
    physicalType: VARCHAR
    description: high, medium or low, fixed per rule.
  - name: decided_by
    logicalType: string
    physicalType: VARCHAR
    description: rules, review (resolve_decisions seed) or llm.
  - name: llm_confidence
    logicalType: number
    physicalType: DOUBLE
    description: The model's stated confidence when the rule is llm.
