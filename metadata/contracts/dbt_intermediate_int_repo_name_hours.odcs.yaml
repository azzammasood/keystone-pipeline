apiVersion: v3.1.0
kind: DataContract
id: keystone-dbt-intermediate-int-repo-name-hours
name: intermediate.int_repo_name_hours
version: 1.0.0
status: active
domain: activity
tags:
- layer:warehouse
- classification:public
description:
  purpose: One row per repository id, name and UTC hour with activity under that name.
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 26
  unit: h
servers:
- server: local
  type: duckdb
  database: data/warehouse/keystone.duckdb
  schema: intermediate
schema:
- name: int_repo_name_hours
  physicalName: int_repo_name_hours
  physicalType: table
  logicalType: object
  description: One row per repository id, name and UTC hour with activity under that name.
  properties:
  - name: repo_id
    logicalType: integer
    physicalType: BIGINT
    description: GitHub repository id.
    required: true
  - name: repo_name
    logicalType: string
    physicalType: VARCHAR
    description: Name seen in the hour.
  - name: seen_hour
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: UTC hour.
  - name: first_seen_at
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: First event under the name in the hour.
  - name: last_seen_at
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: Last event under the name in the hour.
  - name: era_min
    logicalType: string
    physicalType: VARCHAR
    description: Earliest schema era among those events.
  - name: era_max
    logicalType: string
    physicalType: VARCHAR
    description: Latest schema era among those events.
  - name: events
    logicalType: integer
    physicalType: BIGINT
    description: Events in the hour under the name.
