apiVersion: v3.1.0
kind: DataContract
id: keystone-dbt-staging-stg-rollup--repo-hour
name: staging.stg_rollup__repo_hour
version: 1.0.0
status: active
domain: activity
tags:
- layer:warehouse
- classification:public
description:
  purpose: The free engine's hourly rollup with the completeness period of each hour.
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 26
  unit: h
servers:
- server: local
  type: duckdb
  database: data/warehouse/keystone.duckdb
  schema: staging
schema:
- name: stg_rollup__repo_hour
  physicalName: stg_rollup__repo_hour
  physicalType: table
  logicalType: object
  description: The free engine's hourly rollup with the completeness period of each hour.
  properties:
  - name: window_start
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: Start of the UTC hour.
  - name: repo_id
    logicalType: integer
    physicalType: BIGINT
    description: GitHub repository id (null for events without one).
  - name: era
    logicalType: string
    physicalType: VARCHAR
    description: Schema era.
  - name: completeness_period
    logicalType: string
    physicalType: VARCHAR
    description: Completeness period of the hour.
    required: true
  - name: event_type
    logicalType: string
    physicalType: VARCHAR
    description: GH Archive event type.
  - name: events
    logicalType: integer
    physicalType: BIGINT
    description: Events in the hour.
  - name: human_events
    logicalType: integer
    physicalType: BIGINT
    description: Events by actors not flagged as bots.
  - name: opened
    logicalType: integer
    physicalType: BIGINT
    description: Events with action opened.
  - name: closed
    logicalType: integer
    physicalType: BIGINT
    description: Events with action closed.
  - name: reopened
    logicalType: integer
    physicalType: BIGINT
    description: Events with action reopened.
  - name: merged
    logicalType: integer
    physicalType: BIGINT
    description: Closed pull requests with the merged flag set (E1, E2 only).
  - name: merge_known
    logicalType: integer
    physicalType: BIGINT
    description: Closed pull requests whose merged flag is present.
  - name: published
    logicalType: integer
    physicalType: BIGINT
    description: Events with action published.
  - name: added
    logicalType: integer
    physicalType: BIGINT
    description: Events with action added.
  - name: fetched_at_max
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: Newest fetch time of the source files in the window (lineage).
customProperties:
- property: keystoneTest
  value: 'skip: view over the attached rollup database; checked by dbt build'
