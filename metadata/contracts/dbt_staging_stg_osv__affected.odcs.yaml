apiVersion: v3.1.0
kind: DataContract
id: keystone-dbt-staging-stg-osv--affected
name: staging.stg_osv__affected
version: 1.0.0
status: active
domain: vulnerabilities
tags:
- layer:warehouse
- classification:public
description:
  purpose: OSV affected packages.
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 48
  unit: h
servers:
- server: local
  type: duckdb
  database: data/warehouse/keystone.duckdb
  schema: staging
schema:
- name: stg_osv__affected
  physicalName: stg_osv__affected
  physicalType: table
  logicalType: object
  description: OSV affected packages.
  properties:
  - name: vuln_id
    logicalType: string
    physicalType: VARCHAR
    description: OSV id.
    required: true
  - name: affected_index
    logicalType: integer
    physicalType: BIGINT
    description: Position in the affected list of the record.
  - name: ecosystem
    logicalType: string
    physicalType: VARCHAR
    description: OSV ecosystem (PyPI, npm, ...).
  - name: package_name
    logicalType: string
    physicalType: VARCHAR
    description: Package name as OSV spells it.
  - name: package_key
    logicalType: string
    physicalType: VARCHAR
    description: ecosystem/package_name.
    required: true
  - name: purl
    logicalType: string
    physicalType: VARCHAR
    description: Package URL, if given.
  - name: range_count
    logicalType: integer
    physicalType: BIGINT
    description: Number of affected ranges.
  - name: version_count
    logicalType: integer
    physicalType: BIGINT
    description: Number of listed affected versions.
  - name: has_fixed
    logicalType: boolean
    physicalType: BOOLEAN
    description: True when a range names a fixed version or commit.
