apiVersion: v3.1.0
kind: DataContract
id: keystone-osv-repo-refs
name: Silver OSV repository pointers
version: 1.0.0
status: active
domain: packages
tags:
- layer:silver
- classification:public
description:
  purpose: Repository pointers in OSV records (GIT ranges and FIX references).
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 26
  unit: h
servers:
- server: local
  type: local
  format: parquet
  path: data/silver/osv/repo_refs/*.parquet
schema:
- name: repo_refs
  physicalName: repo_refs
  physicalType: table
  logicalType: object
  description: Repository pointers in OSV records (GIT ranges and FIX references).
  properties:
  - name: source_file
    logicalType: string
    physicalType: STRING
    description: Source file the row came from (`osv/<ecosystem>/all.zip` for OSV).
    required: true
  - name: source_sha256
    logicalType: string
    physicalType: STRING
    description: SHA-256 of the verified source file.
    required: true
  - name: fetched_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the source file was fetched (UTC).
    required: true
  - name: source_member
    logicalType: string
    physicalType: STRING
    description: Member of the zip the record came from.
    required: true
  - name: vuln_id
    logicalType: string
    physicalType: STRING
    description: OSV record id.
    required: true
  - name: affected_index
    logicalType: integer
    physicalType: INT64
    description: affected[] entry of a GIT range; null for a FIX reference of the record.
  - name: kind
    logicalType: string
    physicalType: STRING
    description: git_range or fix_reference.
    required: true
  - name: url
    logicalType: string
    physicalType: STRING
    description: The repository URL as given.
    required: true
  - name: repo_host
    logicalType: string
    physicalType: STRING
    description: Host of the repository URL (lower case).
    required: true
  - name: repo_full_name
    logicalType: string
    physicalType: STRING
    description: owner/name, lower case (GitHub names are case-insensitive).
    required: true
