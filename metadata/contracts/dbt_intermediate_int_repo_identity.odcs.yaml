apiVersion: v3.1.0
kind: DataContract
id: keystone-dbt-intermediate-int-repo-identity
name: intermediate.int_repo_identity
version: 1.0.0
status: active
domain: packages
tags:
- layer:warehouse
- classification:public
description:
  purpose: The GitHub repository id each claimed github.com name means today, with the rule used.
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 48
  unit: h
servers:
- server: local
  type: duckdb
  database: data/warehouse/keystone.duckdb
  schema: intermediate
schema:
- name: int_repo_identity
  physicalName: int_repo_identity
  physicalType: table
  logicalType: object
  description: The GitHub repository id each claimed github.com name means today, with the rule used.
  properties:
  - name: repo_name_lower
    logicalType: string
    physicalType: VARCHAR
    description: Claimed owner/name in lower case.
    required: true
  - name: repo_id
    logicalType: integer
    physicalType: BIGINT
    description: Resolved GitHub repository id, or null.
  - name: id_rule
    logicalType: string
    physicalType: VARCHAR
    description: 'ecosystems_current, ecosystems_previous_name, gharchive_unique_name, gharchive_latest_holder,
      ambiguous or not_seen.

      '
  - name: current_name
    logicalType: string
    physicalType: VARCHAR
    description: Current owner/name of the resolved id (ecosyste.ms, else GH Archive).
  - name: seen_in_gharchive
    logicalType: boolean
    physicalType: BOOLEAN
    description: The resolved id appears in the loaded GH Archive data.
  - name: gharchive_ids
    logicalType: integer
    physicalType: BIGINT
    description: Distinct ids GH Archive saw with the name.
  - name: gharchive_disagrees
    logicalType: boolean
    physicalType: BOOLEAN
    description: GH Archive's latest holder of the name is another id than the resolved one.
