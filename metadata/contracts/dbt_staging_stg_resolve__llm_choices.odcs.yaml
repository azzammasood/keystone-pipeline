apiVersion: v3.1.0
kind: DataContract
id: keystone-dbt-staging-stg-resolve--llm-choices
name: staging.stg_resolve__llm_choices
version: 1.0.0
status: active
domain: packages
tags:
- layer:warehouse
- classification:public
description:
  purpose: Latest validated language-model answer per package (empty while the rung is skipped).
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 8760
  unit: h
servers:
- server: local
  type: duckdb
  database: data/warehouse/keystone.duckdb
  schema: staging
schema:
- name: stg_resolve__llm_choices
  physicalName: stg_resolve__llm_choices
  physicalType: table
  logicalType: object
  description: Latest validated language-model answer per package (empty while the rung is skipped).
  properties:
  - name: package_key
    logicalType: string
    physicalType: VARCHAR
    description: Package asked about.
  - name: repo_key
    logicalType: string
    physicalType: VARCHAR
    description: The chosen candidate; null unless outcome is chosen.
  - name: confidence
    logicalType: number
    physicalType: DOUBLE
    description: The model's stated confidence in [0, 1].
  - name: outcome
    logicalType: string
    physicalType: VARCHAR
    description: chosen, declined or refused (named a candidate that was not listed).
  - name: model
    logicalType: string
    physicalType: VARCHAR
    description: Model identifier used.
  - name: candidates
    logicalType: string
    physicalType: VARCHAR
    description: The listed candidates, `|`-separated, exactly as asked.
  - name: decided_at
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: When the answer was recorded (UTC).
