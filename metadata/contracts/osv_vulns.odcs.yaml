apiVersion: v3.1.0
kind: DataContract
id: keystone-osv-vulns
name: Silver OSV records
version: 1.0.0
status: active
domain: vulnerabilities
tags:
- layer:silver
- classification:public
description:
  purpose: One row per OSV record (no free text, no credits).
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 26
  unit: h
servers:
- server: local
  type: local
  format: parquet
  path: data/silver/osv/vulns/*.parquet
schema:
- name: vulns
  physicalName: vulns
  physicalType: table
  logicalType: object
  description: One row per OSV record (no free text, no credits).
  properties:
  - name: source_file
    logicalType: string
    physicalType: STRING
    description: Source file the row came from (`osv/<ecosystem>/all.zip` for OSV).
    required: true
  - name: source_sha256
    logicalType: string
    physicalType: STRING
    description: SHA-256 of the verified source file.
    required: true
  - name: fetched_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the source file was fetched (UTC).
    required: true
  - name: source_member
    logicalType: string
    physicalType: STRING
    description: Member of the zip the record came from.
    required: true
  - name: vuln_id
    logicalType: string
    physicalType: STRING
    description: OSV record id.
    required: true
  - name: schema_version
    logicalType: string
    physicalType: STRING
    description: OSV schema version of the record.
  - name: published_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the record was published (UTC), if stated.
  - name: modified_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the record was last modified (UTC).
    required: true
  - name: withdrawn_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the record was withdrawn (UTC), if it was.
  - name: alias_count
    logicalType: integer
    physicalType: INT64
    description: Number of aliases (CVE, GHSA, ...).
    required: true
  - name: affected_count
    logicalType: integer
    physicalType: INT64
    description: Number of affected[] entries.
    required: true
  - name: is_malicious
    logicalType: boolean
    physicalType: BOOLEAN
    description: True for a malicious-package report (MAL- id).
    required: true
  - name: severity_label
    logicalType: string
    physicalType: STRING
    description: Severity label from database_specific, if any.
  - name: cvss_v3_vector
    logicalType: string
    physicalType: STRING
    description: CVSS v3 vector, if given.
  - name: cvss_v4_vector
    logicalType: string
    physicalType: STRING
    description: CVSS v4 vector, if given.
  - name: github_reviewed
    logicalType: boolean
    physicalType: BOOLEAN
    description: GitHub's reviewed flag, where the record comes from GitHub.
