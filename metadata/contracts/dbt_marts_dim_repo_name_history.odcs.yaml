apiVersion: v3.1.0
kind: DataContract
id: keystone-dbt-marts-dim-repo-name-history
name: marts.dim_repo_name_history
version: 1.0.0
status: active
domain: activity
tags:
- layer:published
- classification:public
description:
  purpose: 'Name history per repository id: one row per uninterrupted spell of a name (compared case-insensitively),
    ordered by first sighting. valid_to is the first sighting of the next spell; old and new names can
    interleave within an hour, so last_seen_at may pass valid_to by less than an hour.'
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 26
  unit: h
servers:
- server: local
  type: duckdb
  database: data/warehouse/keystone.duckdb
  schema: marts
schema:
- name: dim_repo_name_history
  physicalName: dim_repo_name_history
  physicalType: table
  logicalType: object
  description: 'Name history per repository id: one row per uninterrupted spell of a name (compared case-insensitively),
    ordered by first sighting. valid_to is the first sighting of the next spell; old and new names can
    interleave within an hour, so last_seen_at may pass valid_to by less than an hour.'
  properties:
  - name: repo_id
    logicalType: integer
    physicalType: BIGINT
    description: GitHub repository id.
    required: true
  - name: name_seq
    logicalType: integer
    physicalType: BIGINT
    description: Spell number within the repository, from 1.
  - name: repo_name
    logicalType: string
    physicalType: VARCHAR
    description: Name during the spell, spelled as at its latest sighting.
  - name: repo_name_lower
    logicalType: string
    physicalType: VARCHAR
    description: Name in lower case.
  - name: valid_from
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: First event under the name in the spell, UTC.
  - name: valid_to
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: First event of the next spell, UTC; null for the current spell.
  - name: last_seen_at
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: Last event under the name in the spell, UTC.
  - name: first_era
    logicalType: string
    physicalType: VARCHAR
    description: Earliest schema era in the spell.
  - name: last_era
    logicalType: string
    physicalType: VARCHAR
    description: Latest schema era in the spell.
  - name: events
    logicalType: integer
    physicalType: BIGINT
    description: Events in the spell.
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    description: True for the latest spell.
