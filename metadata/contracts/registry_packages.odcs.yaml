apiVersion: v3.1.0
kind: DataContract
id: keystone-registry-packages
name: Silver registry claims
version: 1.0.0
status: active
domain: packages
tags:
- layer:silver
- classification:public
description:
  purpose: 'One row per package lookup and source: the repository the source names, allow-listed fields
    only (no maintainers, authors or emails).'
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 26
  unit: h
servers:
- server: local
  type: local
  format: parquet
  path: data/silver/registry/packages/*.parquet
schema:
- name: packages
  physicalName: packages
  physicalType: table
  logicalType: object
  description: 'One row per package lookup and source: the repository the source names, allow-listed fields
    only (no maintainers, authors or emails).'
  properties:
  - name: source_file
    logicalType: string
    physicalType: STRING
    description: Source file the row came from (`osv/<ecosystem>/all.zip` for OSV).
    required: true
  - name: source_sha256
    logicalType: string
    physicalType: STRING
    description: SHA-256 of the verified source file.
    required: true
  - name: fetched_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the source file was fetched (UTC).
    required: true
  - name: source
    logicalType: string
    physicalType: STRING
    description: ecosystems (ecosyste.ms packages API) or npm_registry (registry.npmjs.org).
    required: true
  - name: ecosystem
    logicalType: string
    physicalType: STRING
    description: Ecosystem in OSV spelling (PyPI, npm, crates.io, ...).
    required: true
  - name: package_name
    logicalType: string
    physicalType: STRING
    description: Package name as requested.
    required: true
  - name: package_key
    logicalType: string
    physicalType: STRING
    description: ecosystem/name normalised as the registry compares names (PEP 503 for PyPI).
    required: true
  - name: found
    logicalType: boolean
    physicalType: BOOLEAN
    description: False when the source was asked and has no record of the package.
    required: true
  - name: critical
    logicalType: boolean
    physicalType: BOOLEAN
    description: ecosyste.ms critical flag (ecosystems rows only).
  - name: repository_url
    logicalType: string
    physicalType: STRING
    description: The repository URL as the source spells it.
  - name: repo_host
    logicalType: string
    physicalType: STRING
    description: github.com, gitlab.com or bitbucket.org; null when the URL names no repository.
  - name: repo_full_name
    logicalType: string
    physicalType: STRING
    description: owner/name in lower case.
  - name: repo_subpath
    logicalType: string
    physicalType: STRING
    description: Directory inside the repository (a monorepo package), if given.
  - name: url_rejected
    logicalType: string
    physicalType: STRING
    description: Why repository_url names no repository (other_host, no_repository_path, ...).
  - name: repo_github_id
    logicalType: integer
    physicalType: INT64
    description: GitHub repository id per ecosyste.ms (repo_metadata.uuid).
  - name: repo_current_name
    logicalType: string
    physicalType: STRING
    description: Current owner/name of that repository per ecosyste.ms, lower case.
  - name: repo_fork
    logicalType: boolean
    physicalType: BOOLEAN
    description: The repository is a fork (ecosyste.ms).
  - name: repo_archived
    logicalType: boolean
    physicalType: BOOLEAN
    description: The repository is archived (ecosyste.ms).
  - name: dependent_packages
    logicalType: integer
    physicalType: INT64
    description: Packages depending on this one (ecosyste.ms).
  - name: dependent_repos
    logicalType: integer
    physicalType: INT64
    description: Repositories depending on this package (ecosyste.ms).
  - name: downloads
    logicalType: integer
    physicalType: INT64
    description: Downloads in downloads_period (ecosyste.ms).
  - name: downloads_period
    logicalType: string
    physicalType: STRING
    description: Period of downloads, e.g. last-month.
  - name: latest_release_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: Latest release time per ecosyste.ms (UTC).
  - name: etag
    logicalType: string
    physicalType: STRING
    description: ETag of the npm response, for conditional refreshes.
