apiVersion: v3.1.0
kind: DataContract
id: keystone-rollup-repo-hour
name: Rollup repo_hour (free engine)
version: 1.0.0
status: active
domain: activity
tags:
- layer:rollup
- classification:public
description:
  purpose: Activity per repository, era and event type in UTC hours (ADR-024), DuckDB.
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 26
  unit: h
servers:
- server: local
  type: duckdb
  database: data/rollup/rollup.duckdb
  schema: main
schema:
- name: repo_hour
  physicalName: repo_hour
  physicalType: table
  logicalType: object
  description: Activity per repository, era and event type in UTC hours (ADR-024), DuckDB.
  properties:
  - name: window_start
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: Start of the UTC hour.
  - name: repo_id
    logicalType: integer
    physicalType: BIGINT
    description: GitHub repository id.
  - name: era
    logicalType: string
    physicalType: VARCHAR
    description: Schema era of the events.
  - name: event_type
    logicalType: string
    physicalType: VARCHAR
    description: GitHub event type.
  - name: events
    logicalType: integer
    physicalType: BIGINT
    description: Events in the window.
  - name: human_events
    logicalType: integer
    physicalType: BIGINT
    description: Events by accounts not flagged as bots.
  - name: opened
    logicalType: integer
    physicalType: BIGINT
    description: Events with action opened.
  - name: closed
    logicalType: integer
    physicalType: BIGINT
    description: Events with action closed.
  - name: reopened
    logicalType: integer
    physicalType: BIGINT
    description: Events with action reopened.
  - name: merged
    logicalType: integer
    physicalType: BIGINT
    description: Pull requests closed as merged (counted only where merge_known counts them).
  - name: merge_known
    logicalType: integer
    physicalType: BIGINT
    description: Closed pull requests whose merged flag is present (E1, E2).
  - name: published
    logicalType: integer
    physicalType: BIGINT
    description: Events with action published (releases).
  - name: added
    logicalType: integer
    physicalType: BIGINT
    description: Events with action added (members).
  - name: fetched_at_max
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: Newest fetch time of the contributing source files (UTC).
