apiVersion: v3.1.0
kind: DataContract
id: keystone-dbt-staging-stg-osv--vulns
name: staging.stg_osv__vulns
version: 1.0.0
status: active
domain: vulnerabilities
tags:
- layer:warehouse
- classification:public
description:
  purpose: OSV records (identifiers, dates, severity labels, lineage).
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 48
  unit: h
servers:
- server: local
  type: duckdb
  database: data/warehouse/keystone.duckdb
  schema: staging
schema:
- name: stg_osv__vulns
  physicalName: stg_osv__vulns
  physicalType: table
  logicalType: object
  description: OSV records (identifiers, dates, severity labels, lineage).
  properties:
  - name: vuln_id
    logicalType: string
    physicalType: VARCHAR
    description: OSV id (GHSA-, PYSEC-, MAL-, ...).
    required: true
  - name: published_at
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: Publication time, UTC.
  - name: modified_at
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: Last modification time, UTC.
  - name: withdrawn_at
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: Withdrawal time, UTC; null when not withdrawn.
  - name: alias_count
    logicalType: integer
    physicalType: BIGINT
    description: Number of aliases (other ids for the same issue).
  - name: affected_count
    logicalType: integer
    physicalType: BIGINT
    description: Number of affected entries in the record.
  - name: is_malicious
    logicalType: boolean
    physicalType: BOOLEAN
    description: True for OpenSSF malicious-package reports.
  - name: severity_label
    logicalType: string
    physicalType: VARCHAR
    description: Database severity label (GitHub-reviewed records), else null.
  - name: cvss_v3_vector
    logicalType: string
    physicalType: VARCHAR
    description: CVSS v3 vector string, if given.
  - name: cvss_v4_vector
    logicalType: string
    physicalType: VARCHAR
    description: CVSS v4 vector string, if given.
  - name: github_reviewed
    logicalType: boolean
    physicalType: BOOLEAN
    description: The GitHub reviewed flag, if given.
  - name: source_file
    logicalType: string
    physicalType: VARCHAR
    description: Lineage, the zip the record came from.
  - name: source_sha256
    logicalType: string
    physicalType: VARCHAR
    description: Lineage, SHA-256 of that zip.
  - name: fetched_at
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: Lineage, when the zip was fetched (UTC).
