apiVersion: v3.1.0
kind: DataContract
id: keystone-dbt-marts-bridge-package-repo
name: marts.bridge_package_repo
version: 1.0.0
status: active
domain: packages
tags:
- layer:published
- classification:public
description:
  purpose: 'Package-to-repository candidates from OSV evidence. Confidence is a rule (high: GIT range
    of the package; medium: FIX reference in a record about this package only; low: FIX reference in a
    record about several packages). repo_id is set only when exactly one GitHub repository id ever carried
    the name in the loaded data.'
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 48
  unit: h
servers:
- server: local
  type: duckdb
  database: data/warehouse/keystone.duckdb
  schema: marts
schema:
- name: bridge_package_repo
  physicalName: bridge_package_repo
  physicalType: table
  logicalType: object
  description: 'Package-to-repository candidates from OSV evidence. Confidence is a rule (high: GIT range
    of the package; medium: FIX reference in a record about this package only; low: FIX reference in a
    record about several packages). repo_id is set only when exactly one GitHub repository id ever carried
    the name in the loaded data.'
  properties:
  - name: package_key
    logicalType: string
    physicalType: VARCHAR
    description: ecosystem/package_name.
    required: true
  - name: repo_host
    logicalType: string
    physicalType: VARCHAR
    description: github.com, gitlab.com or bitbucket.org.
  - name: repo_full_name
    logicalType: string
    physicalType: VARCHAR
    description: owner/name in lower case, as the evidence names it.
  - name: repo_id
    logicalType: integer
    physicalType: BIGINT
    description: Matched GitHub repository id, or null (see repo_match).
  - name: repo_match
    logicalType: string
    physicalType: VARCHAR
    description: unique_name, ambiguous_name, not_seen (no event in the loaded data) or not_github.
  - name: confidence
    logicalType: string
    physicalType: VARCHAR
    description: high, medium or low (rule above).
  - name: evidence_vulns
    logicalType: integer
    physicalType: BIGINT
    description: OSV records giving evidence for the pair.
  - name: mapping_source
    logicalType: string
    physicalType: VARCHAR
    description: Where the evidence comes from (osv).
