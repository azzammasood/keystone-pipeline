apiVersion: v3.1.0
kind: DataContract
id: keystone-resolve-llm-choices
name: Language-model choices
version: 1.0.0
status: active
domain: packages
tags:
- layer:silver
- classification:public
description:
  purpose: 'Validated answers of the language-model rung: a candidate from the listed set, a decline,
    or a refusal (an unlisted answer); empty while the rung is skipped.'
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 26
  unit: h
servers:
- server: local
  type: local
  format: parquet
  path: data/silver/resolve/llm_choices/*.parquet
schema:
- name: llm_choices
  physicalName: llm_choices
  physicalType: table
  logicalType: object
  description: 'Validated answers of the language-model rung: a candidate from the listed set, a decline,
    or a refusal (an unlisted answer); empty while the rung is skipped.'
  properties:
  - name: package_key
    logicalType: string
    physicalType: STRING
    description: Package asked about.
    required: true
  - name: candidate
    logicalType: string
    physicalType: STRING
    description: The chosen candidate (a listed repo_key); null unless outcome is chosen.
  - name: confidence
    logicalType: number
    physicalType: DOUBLE
    description: The model's stated confidence in [0, 1], for chosen answers.
  - name: outcome
    logicalType: string
    physicalType: STRING
    description: chosen, declined or refused (an answer outside the listed candidates).
    required: true
  - name: model
    logicalType: string
    physicalType: STRING
    description: Model identifier.
    required: true
  - name: candidates
    logicalType: string
    physicalType: STRING
    description: The listed candidates, pipe-separated, exactly as asked.
    required: true
  - name: decided_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the answer was recorded (UTC).
    required: true
