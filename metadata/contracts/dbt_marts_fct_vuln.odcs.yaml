apiVersion: v3.1.0
kind: DataContract
id: keystone-dbt-marts-fct-vuln
name: marts.fct_vuln
version: 1.0.0
status: active
domain: vulnerabilities
tags:
- layer:published
- classification:public
description:
  purpose: One row per OSV record and affected package.
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 48
  unit: h
servers:
- server: local
  type: duckdb
  database: data/warehouse/keystone.duckdb
  schema: marts
schema:
- name: fct_vuln
  physicalName: fct_vuln
  physicalType: table
  logicalType: object
  description: One row per OSV record and affected package.
  properties:
  - name: vuln_id
    logicalType: string
    physicalType: VARCHAR
    description: OSV id.
    required: true
  - name: package_key
    logicalType: string
    physicalType: VARCHAR
    description: ecosystem/package_name.
  - name: ecosystem
    logicalType: string
    physicalType: VARCHAR
    description: OSV ecosystem.
  - name: package_name
    logicalType: string
    physicalType: VARCHAR
    description: Package name.
  - name: published_at
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: Publication time, UTC.
  - name: modified_at
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: Last modification time, UTC.
  - name: withdrawn_at
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: Withdrawal time, UTC; null when not withdrawn.
  - name: is_malicious
    logicalType: boolean
    physicalType: BOOLEAN
    description: True for malicious-package reports.
  - name: severity_label
    logicalType: string
    physicalType: VARCHAR
    description: Database severity label, if given.
  - name: cvss_v3_vector
    logicalType: string
    physicalType: VARCHAR
    description: CVSS v3 vector, if given.
  - name: cvss_v4_vector
    logicalType: string
    physicalType: VARCHAR
    description: CVSS v4 vector, if given.
  - name: has_fixed
    logicalType: boolean
    physicalType: BOOLEAN
    description: True when any range for the package names a fix.
  - name: alias_count
    logicalType: integer
    physicalType: BIGINT
    description: Number of aliases of the record.
  - name: source_file
    logicalType: string
    physicalType: VARCHAR
    description: Lineage, the OSV zip.
  - name: source_sha256
    logicalType: string
    physicalType: VARCHAR
    description: Lineage, SHA-256 of the zip.
  - name: fetched_at
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: Lineage, fetch time of the zip (UTC).
