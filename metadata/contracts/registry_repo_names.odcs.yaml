apiVersion: v3.1.0
kind: DataContract
id: keystone-registry-repo-names
name: Silver repository names (ecosyste.ms)
version: 1.0.0
status: active
domain: packages
tags:
- layer:silver
- classification:public
description:
  purpose: Current and previous names of GitHub repositories by id, per ecosyste.ms.
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 26
  unit: h
servers:
- server: local
  type: local
  format: parquet
  path: data/silver/registry/repo_names/*.parquet
schema:
- name: repo_names
  physicalName: repo_names
  physicalType: table
  logicalType: object
  description: Current and previous names of GitHub repositories by id, per ecosyste.ms.
  properties:
  - name: source_file
    logicalType: string
    physicalType: STRING
    description: Source file the row came from (`osv/<ecosystem>/all.zip` for OSV).
    required: true
  - name: source_sha256
    logicalType: string
    physicalType: STRING
    description: SHA-256 of the verified source file.
    required: true
  - name: fetched_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the source file was fetched (UTC).
    required: true
  - name: repo_github_id
    logicalType: integer
    physicalType: INT64
    description: GitHub repository id.
    required: true
  - name: repo_name_lower
    logicalType: string
    physicalType: STRING
    description: owner/name in lower case.
    required: true
  - name: kind
    logicalType: string
    physicalType: STRING
    description: current or previous.
    required: true
