apiVersion: v3.1.0
kind: DataContract
id: keystone-dbt-intermediate-int-package-repo-claims
name: intermediate.int_package_repo_claims
version: 1.0.0
status: active
domain: packages
tags:
- layer:warehouse
- classification:public
description:
  purpose: One row per package, source and named repository (OSV, ecosyste.ms, npm registry).
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 48
  unit: h
servers:
- server: local
  type: duckdb
  database: data/warehouse/keystone.duckdb
  schema: intermediate
schema:
- name: int_package_repo_claims
  physicalName: int_package_repo_claims
  physicalType: table
  logicalType: object
  description: One row per package, source and named repository (OSV, ecosyste.ms, npm registry).
  properties:
  - name: package_key
    logicalType: string
    physicalType: VARCHAR
    description: ecosystem/name normalised.
    required: true
  - name: source
    logicalType: string
    physicalType: VARCHAR
    description: osv_git_range, osv_fix_sole, osv_fix_shared, ecosystems or npm_registry.
  - name: repo_host
    logicalType: string
    physicalType: VARCHAR
    description: github.com, gitlab.com or bitbucket.org.
  - name: repo_full_name
    logicalType: string
    physicalType: VARCHAR
    description: owner/name in lower case, as the claim names it.
  - name: in_subpath
    logicalType: boolean
    physicalType: BOOLEAN
    description: The claim names a directory inside the repository (monorepo).
  - name: ecosystems_repo_id
    logicalType: integer
    physicalType: BIGINT
    description: GitHub id ecosyste.ms resolved the URL to (ecosystems claims only).
  - name: evidence
    logicalType: integer
    physicalType: BIGINT
    description: OSV records giving the claim (1 for registry claims).
