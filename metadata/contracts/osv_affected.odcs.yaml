apiVersion: v3.1.0
kind: DataContract
id: keystone-osv-affected
name: Silver OSV affected packages
version: 1.0.0
status: active
domain: vulnerabilities
tags:
- layer:silver
- classification:public
description:
  purpose: One row per OSV affected[] entry with a package.
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 26
  unit: h
servers:
- server: local
  type: local
  format: parquet
  path: data/silver/osv/affected/*.parquet
schema:
- name: affected
  physicalName: affected
  physicalType: table
  logicalType: object
  description: One row per OSV affected[] entry with a package.
  properties:
  - name: source_file
    logicalType: string
    physicalType: STRING
    description: Source file the row came from (`osv/<ecosystem>/all.zip` for OSV).
    required: true
  - name: source_sha256
    logicalType: string
    physicalType: STRING
    description: SHA-256 of the verified source file.
    required: true
  - name: fetched_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the source file was fetched (UTC).
    required: true
  - name: source_member
    logicalType: string
    physicalType: STRING
    description: Member of the zip the record came from.
    required: true
  - name: vuln_id
    logicalType: string
    physicalType: STRING
    description: OSV record id.
    required: true
  - name: affected_index
    logicalType: integer
    physicalType: INT64
    description: Position of the entry in affected[].
    required: true
  - name: ecosystem
    logicalType: string
    physicalType: STRING
    description: Package ecosystem as OSV spells it.
    required: true
  - name: package_name
    logicalType: string
    physicalType: STRING
    description: Package name as OSV spells it.
    required: true
  - name: purl
    logicalType: string
    physicalType: STRING
    description: Package URL, if given.
  - name: range_count
    logicalType: integer
    physicalType: INT64
    description: Number of version ranges.
    required: true
  - name: version_count
    logicalType: integer
    physicalType: INT64
    description: Number of listed versions.
    required: true
  - name: has_fixed
    logicalType: boolean
    physicalType: BOOLEAN
    description: A fixed version is known in some range.
    required: true
