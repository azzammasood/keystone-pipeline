apiVersion: v3.1.0
kind: DataContract
id: keystone-dbt-marts-dim-repo-rename
name: marts.dim_repo_rename
version: 1.0.0
status: active
domain: activity
tags:
- layer:published
- classification:public
description:
  purpose: 'Repository renames: one row per id and name change, from GH Archive (the id under consecutive
    names: auto_exact) and ecosyste.ms previous names (accepted when GH Archive did not see the change).'
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 26
  unit: h
servers:
- server: local
  type: duckdb
  database: data/warehouse/keystone.duckdb
  schema: marts
schema:
- name: dim_repo_rename
  physicalName: dim_repo_rename
  physicalType: table
  logicalType: object
  description: 'Repository renames: one row per id and name change, from GH Archive (the id under consecutive
    names: auto_exact) and ecosyste.ms previous names (accepted when GH Archive did not see the change).'
  properties:
  - name: repo_id
    logicalType: integer
    physicalType: BIGINT
    description: GitHub repository id.
    required: true
  - name: from_name
    logicalType: string
    physicalType: VARCHAR
    description: Name before the change (owner/name, lower case).
  - name: to_name
    logicalType: string
    physicalType: VARCHAR
    description: Name after the change.
  - name: renamed_after
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: Last GH Archive sighting of the old name (UTC); null for ecosyste.ms rows.
  - name: renamed_before
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: First GH Archive sighting of the new name (UTC); null for ecosyste.ms rows.
  - name: by_gharchive
    logicalType: boolean
    physicalType: BOOLEAN
    description: GH Archive shows the change.
  - name: by_ecosystems
    logicalType: boolean
    physicalType: BOOLEAN
    description: ecosyste.ms lists from_name as a previous name of the id.
  - name: status
    logicalType: string
    physicalType: VARCHAR
    description: auto_exact or accepted.
  - name: rule
    logicalType: string
    physicalType: VARCHAR
    description: same_id_new_name (GH Archive) or ecosystems_previous_name.
  - name: confidence
    logicalType: string
    physicalType: VARCHAR
    description: high or medium.
