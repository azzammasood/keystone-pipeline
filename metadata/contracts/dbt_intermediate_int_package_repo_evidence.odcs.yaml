apiVersion: v3.1.0
kind: DataContract
id: keystone-dbt-intermediate-int-package-repo-evidence
name: intermediate.int_package_repo_evidence
version: 1.0.0
status: active
domain: packages
tags:
- layer:warehouse
- classification:public
description:
  purpose: Each OSV pointer from a package to a repository, with how many packages the record names.
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 48
  unit: h
servers:
- server: local
  type: duckdb
  database: data/warehouse/keystone.duckdb
  schema: intermediate
schema:
- name: int_package_repo_evidence
  physicalName: int_package_repo_evidence
  physicalType: table
  logicalType: object
  description: Each OSV pointer from a package to a repository, with how many packages the record names.
  properties:
  - name: package_key
    logicalType: string
    physicalType: VARCHAR
    description: ecosystem/package_name.
  - name: repo_host
    logicalType: string
    physicalType: VARCHAR
    description: Repository host.
  - name: repo_full_name
    logicalType: string
    physicalType: VARCHAR
    description: owner/name in lower case.
  - name: kind
    logicalType: string
    physicalType: VARCHAR
    description: git_range or fix_reference.
  - name: vuln_id
    logicalType: string
    physicalType: VARCHAR
    description: OSV record giving the evidence.
  - name: packages_in_vuln
    logicalType: integer
    physicalType: BIGINT
    description: Distinct packages named by that record.
