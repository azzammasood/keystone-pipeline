apiVersion: v3.1.0
kind: DataContract
id: keystone-dbt-marts-fct-repo-day
name: marts.fct_repo_day
version: 1.0.0
status: active
domain: activity
tags:
- layer:published
- classification:public
description:
  purpose: Daily activity per repository (UTC day), schema era and completeness period. Era and period
    are keys, so a day crossing a boundary has a row per side.
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 26
  unit: h
servers:
- server: local
  type: duckdb
  database: data/warehouse/keystone.duckdb
  schema: marts
schema:
- name: fct_repo_day
  physicalName: fct_repo_day
  physicalType: table
  logicalType: object
  description: Daily activity per repository (UTC day), schema era and completeness period. Era and period
    are keys, so a day crossing a boundary has a row per side.
  properties:
  - name: activity_date
    logicalType: date
    physicalType: DATE
    description: UTC day.
    required: true
  - name: repo_id
    logicalType: integer
    physicalType: BIGINT
    description: GitHub repository id.
    required: true
  - name: era
    logicalType: string
    physicalType: VARCHAR
    description: Schema era.
  - name: completeness_period
    logicalType: string
    physicalType: VARCHAR
    description: Completeness period.
    required: true
  - name: events
    logicalType: integer
    physicalType: BIGINT
    description: All events.
  - name: human_events
    logicalType: integer
    physicalType: BIGINT
    description: Events by actors not flagged as bots.
  - name: pushes
    logicalType: integer
    physicalType: BIGINT
    description: PushEvents.
  - name: prs_opened
    logicalType: integer
    physicalType: BIGINT
    description: Pull requests opened.
  - name: prs_closed
    logicalType: integer
    physicalType: BIGINT
    description: Pull requests closed (merged or not).
  - name: prs_merged
    logicalType: integer
    physicalType: BIGINT
    description: Closed pull requests marked merged (E1, E2 only).
  - name: pr_merge_known
    logicalType: integer
    physicalType: BIGINT
    description: Closed pull requests whose merged flag is present.
  - name: issues_opened
    logicalType: integer
    physicalType: BIGINT
    description: Issues opened.
  - name: issues_closed
    logicalType: integer
    physicalType: BIGINT
    description: Issues closed.
  - name: issue_comments
    logicalType: integer
    physicalType: BIGINT
    description: IssueCommentEvents.
  - name: releases_published
    logicalType: integer
    physicalType: BIGINT
    description: Releases published.
  - name: members_added
    logicalType: integer
    physicalType: BIGINT
    description: Collaborators added (MemberEvent added).
  - name: stars
    logicalType: integer
    physicalType: BIGINT
    description: WatchEvents (stars).
  - name: forks
    logicalType: integer
    physicalType: BIGINT
    description: ForkEvents.
  - name: fetched_at_max
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: Newest fetch time of the source files (lineage).
