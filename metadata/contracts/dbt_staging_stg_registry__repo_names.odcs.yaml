apiVersion: v3.1.0
kind: DataContract
id: keystone-dbt-staging-stg-registry--repo-names
name: staging.stg_registry__repo_names
version: 1.0.0
status: active
domain: packages
tags:
- layer:warehouse
- classification:public
description:
  purpose: Current and previous names per GitHub repository id, per ecosyste.ms.
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 192
  unit: h
servers:
- server: local
  type: duckdb
  database: data/warehouse/keystone.duckdb
  schema: staging
schema:
- name: stg_registry__repo_names
  physicalName: stg_registry__repo_names
  physicalType: table
  logicalType: object
  description: Current and previous names per GitHub repository id, per ecosyste.ms.
  properties:
  - name: repo_id
    logicalType: integer
    physicalType: BIGINT
    description: GitHub repository id.
    required: true
  - name: repo_name_lower
    logicalType: string
    physicalType: VARCHAR
    description: owner/name in lower case.
  - name: kind
    logicalType: string
    physicalType: VARCHAR
    description: current or previous.
  - name: fetched_at
    logicalType: timestamp
    physicalType: TIMESTAMP WITH TIME ZONE
    description: Newest fetch that reported the name (UTC).
