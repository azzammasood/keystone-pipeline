apiVersion: v3.1.0
kind: DataContract
id: keystone-dbt-intermediate-int-package-universe
name: intermediate.int_package_universe
version: 1.0.0
status: active
domain: packages
tags:
- layer:warehouse
- classification:public
description:
  purpose: 'Packages Phase 7 resolves, one row per normalised key: OSV packages and the ecosyste.ms critical
    sets. Packages with malware reports only are kept as scope osv_malware_only.'
  usage: Generated by `keystone metadata contracts` (export/contracts.py).
team:
- username: keystone-maintainers
  role: owner
slaProperties:
- property: freshness
  value: 48
  unit: h
servers:
- server: local
  type: duckdb
  database: data/warehouse/keystone.duckdb
  schema: intermediate
schema:
- name: int_package_universe
  physicalName: int_package_universe
  physicalType: table
  logicalType: object
  description: 'Packages Phase 7 resolves, one row per normalised key: OSV packages and the ecosyste.ms
    critical sets. Packages with malware reports only are kept as scope osv_malware_only.'
  properties:
  - name: package_key
    logicalType: string
    physicalType: VARCHAR
    description: ecosystem/name normalised (PEP 503 for PyPI).
    required: true
  - name: ecosystem
    logicalType: string
    physicalType: VARCHAR
    description: Ecosystem in OSV spelling.
  - name: package_name
    logicalType: string
    physicalType: VARCHAR
    description: Name as the registry or OSV spells it.
  - name: in_osv
    logicalType: boolean
    physicalType: BOOLEAN
    description: The package has OSV records.
  - name: osv_spellings
    logicalType: integer
    physicalType: BIGINT
    description: OSV spellings that normalise to this key (dim_package rows).
  - name: critical
    logicalType: boolean
    physicalType: BOOLEAN
    description: ecosyste.ms flags the package critical.
  - name: package_scope
    logicalType: string
    physicalType: VARCHAR
    description: critical, osv (has a non-malware advisory), osv_malware_only or registry_only.
