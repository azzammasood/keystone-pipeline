name: parity

# Engine parity (Phase 4): the DuckDB and Flink rollups must match row for row on shared
# fixtures, including late and out-of-order events. Needs the compose stack (Redpanda, Flink,
# Lakekeeper, RustFS), so it runs only when rollup code changes, weekly, or by hand: measured
# 2.6 runner minutes (run 39465097650) against the free 2,000 a month (private repo).
# Phase 5 adds the lakehouse gate: the dbt marts (written to Iceberg by DuckDB) and a Flink
# rollup table must read identically in DuckDB, Spark, Flink and Trino.
on:
  push:
    branches: [main]
    paths:
      - src/keystone/warehouse/**
      - dbt/**
      - tests/fixtures/**
      - config/sources.yml
      - pyproject.toml
      - uv.lock
      - src/keystone/rollup/**
      - src/keystone/parsers/**
      - contracts/avro/**
      - compose/**
      - tests/parity/**
      - .github/workflows/parity.yml
  pull_request:
    paths:
      - src/keystone/warehouse/**
      - dbt/**
      - tests/fixtures/**
      - config/sources.yml
      - pyproject.toml
      - uv.lock
      - src/keystone/rollup/**
      - src/keystone/parsers/**
      - contracts/avro/**
      - compose/**
      - tests/parity/**
      - .github/workflows/parity.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen --all-groups
      - name: Start the streaming and catalog profiles
        run: |
          mkdir -p data/flink/jobs
          docker compose -f compose/docker-compose.yml --profile streaming --profile catalog up -d --build
          # The one-shot catalog bootstrap must have finished cleanly.
          for i in $(seq 1 60); do
            state=$(docker compose -f compose/docker-compose.yml --profile catalog ps -a catalog-init --format '{{.State}} {{.ExitCode}}')
            [ "$state" = "exited 0" ] && break
            sleep 2
          done
          docker compose -f compose/docker-compose.yml --profile catalog logs catalog-init
          [ "$state" = "exited 0" ]
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8081/overview >/dev/null &&
              docker compose -f compose/docker-compose.yml exec -T redpanda rpk cluster health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fs http://127.0.0.1:8081/overview >/dev/null
          docker compose -f compose/docker-compose.yml exec -T redpanda rpk cluster health --exit-when-healthy
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}'
      - run: uv run pytest tests/parity -v
        env:
          KEYSTONE_STACK_TESTS: "1"
          KEYSTONE_ACTOR_SALT: ci-only-salt-not-a-secret-0000
      - name: Warehouse on fixtures, published to Iceberg, read by four engines
        env:
          KEYSTONE_ACTOR_SALT: ci-only-salt-not-a-secret-0000
        run: |
          compose="docker compose -f compose/docker-compose.yml"
          $compose --profile spark build spark
          $compose --profile trino up -d --wait trino
          uv run keystone parse files tests/fixtures/gharchive/*.json.gz --root ci-data
          uv run keystone rollup run --root ci-data
          uv run keystone parse osv --zip tests/fixtures/osv/PyPI/all.zip --root ci-data
          uv run keystone warehouse build --root ci-data
          uv run keystone warehouse publish --root ci-data --prefix ci_
          uv run keystone stream produce --root ci-data --topic ci-lake --fresh
          uv run keystone rollup flink --namespace ci_rollup --topic ci-lake --mode batch
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}'
          tables="--namespace ci_marts --namespace ci_metrics --table ci_rollup.repo_hour"
          uv run keystone warehouse verify $tables --engine duckdb --engine spark --engine flink --engine trino
      - if: failure()
        run: docker compose -f compose/docker-compose.yml --profile streaming --profile catalog --profile trino logs --tail 200
      - if: always()
        run: docker compose -f compose/docker-compose.yml --profile streaming --profile catalog --profile trino down -v
