name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run sqlfluff lint src/keystone/rollup/sql
      # Golden oracle hours (tests/test_golden.py): about 16 MB, fetched once politely and cached.
      - id: golden
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw/gharchive
          key: golden-${{ hashFiles('tests/fixtures/oracles/gharchive_hours.json') }}-v1
      - if: steps.golden.outputs.cache-hit != 'true'
        run: |
          for h in 2011-02-12T00 2012-06-15T12 2013-06-15T12 2015-01-01T12 2026-10-19T12; do
            end=$(date -u -d "${h/T/ } +1 hour" +%Y-%m-%dT%H)
            uv run keystone ingest gharchive --start "$h" --end "$end" --keep --no-parse
          done
      - run: uv run pytest
        env:
          KEYSTONE_ACTOR_SALT: ci-only-salt-not-a-secret-0000
          # A cache saved after a failed fetch must not switch the golden tests off silently.
          KEYSTONE_GOLDEN_REQUIRED: 2011-02-12-0,2012-06-15-12,2013-06-15-12,2015-01-01-12,2026-10-19-12

  contracts:
    runs-on: ubuntu-latest
    env:
      # Fixtures are synthetic (scrubbed), so a public salt is fine here and only here.
      KEYSTONE_ACTOR_SALT: ci-only-salt-not-a-secret-0000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen --all-groups
      - run: |
          for c in contracts/*.odcs.yaml; do uv run datacontract lint "$c"; done
      - run: >-
          uv run keystone parse files tests/fixtures/gharchive/*.json.gz
          tests/fixtures/gharchive/quarantine/*.json.gz --root ci-data
      - run: uv run keystone quality contracts --root ci-data --require-all --no-generated
      - run: uv run keystone quality gx --root ci-data

  metadata:
    # Phase 6: lineage (CLI + dbt-ol), generated contracts, the static export and its gates,
    # and pipeline_metrics.json against its schema, on the committed fixtures.
    runs-on: ubuntu-latest
    env:
      KEYSTONE_ACTOR_SALT: ci-only-salt-not-a-secret-0000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen --all-groups
      - run: |
          uv run keystone parse files tests/fixtures/gharchive/*.json.gz             tests/fixtures/gharchive/quarantine/*.json.gz --root ci-data
          uv run keystone profile check --run --root ci-data  # no full stack: falls back to free
          uv run keystone parse osv --zip tests/fixtures/osv/PyPI/all.zip --root ci-data
          uv run keystone warehouse build --root ci-data
          # Phase 7: recorded registry responses (no network), then the mapping and its report
          uv run keystone resolve fetch --root ci-data --replay tests/fixtures/registry
          uv run keystone warehouse build --root ci-data
          uv run keystone resolve report --root ci-data --require-registry
      - run: uv run keystone lineage dbt --root ci-data  # dbt-ol runs natively on Linux
      - run: uv run keystone metadata contracts --root ci-data --check
      - run: uv run keystone quality contracts --root ci-data --require-all
      # The full gate path needs an Iceberg publish: the parity workflow checks it.
      - run: uv run keystone metadata export --root ci-data --out ci-metadata
      - run: uv run keystone metrics emit --root ci-data --metadata-dir ci-metadata
      # The fallback decision reached pipeline_metrics.json (ADR-040); all JSON Schemas and their
      # examples pass (ADR-043).
      - run: jq -e '.produced_by.profile == "free" and .produced_by.fallback' ci-data/metrics/pipeline_metrics.json
      - run: uv run python -m keystone.export.schemas
      # Phase 10 gate (ADR-062): the fallback run publishes the site exports, every file checked
      # by its schema; the brief is skipped (no key in CI) and says so.
      - name: Site exports from the fallback run
        run: |
          db=ci-data/warehouse/keystone.duckdb rollup=ci-data/rollup/rollup.duckdb
          uv run keystone score live --rollup "$rollup" --warehouse "$db" --out ci-data/score/live.json
          uv run keystone score backtest --rollup "$rollup" --warehouse "$db" \
            --out ci-data/score/backtest.json --report ci-data/score/backtest.md
          uv run keystone export site --root ci-data --score-dir ci-data/score --warehouse "$db" \
            --metrics ci-data/metrics/pipeline_metrics.json --metadata-dir ci-metadata --out ci-site
          uv run keystone narrate brief --site ci-site --root ci-data --cache-dir ci-data/narrate
          jq -e '.produced_by.fallback and .status.state == "skipped"' ci-site/brief.json
          jq -e '.produced_by.profile == "free" and .row_count >= 9' ci-site/index.json

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # Audit the locked dependency set (runtime and dev), not the runner's environment.
      - run: uv export --frozen --all-groups --no-emit-project --format requirements-txt -o requirements.lock.txt
      - run: uvx pip-audit --strict --disable-pip -r requirements.lock.txt
      # Workflow audit (template injection, permissions, pinning); offline, no token needed.
      - run: uvx zizmor@1.31.1 --offline .github/workflows
