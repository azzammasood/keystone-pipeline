name: ingest

# Scheduled incremental ingest (Phase 10, ADR-041): the last completed GH Archive hours, verified,
# parsed to silver, gaps reported. Calls only the CLI. The schedule is off until the repository
# variable KEYSTONE_SCHEDULES is `true`; a manual dispatch always runs. Logs are public: steps
# print counts only, never actor keys or secrets. Needs the production KEYSTONE_ACTOR_SALT
# secret (owner, Phase 9).
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: Completed hours to (re)check, counting back from two hours ago.
        default: "48"

permissions:
  contents: read

concurrency:
  group: keystone-data  # ingest and publish share the cached data directory
  cancel-in-progress: false

jobs:
  # GH Archive allows this project at most 2 concurrent requests (config/policy.yml). A backfill
  # chunk already uses both, so ingest waits its turn: it skips while a backfill run is in
  # progress (ADR-062). The next run re-checks the hours (cheap conditional requests).
  guard:
    if: github.event_name == 'workflow_dispatch' || vars.KEYSTONE_SCHEDULES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      busy: ${{ steps.backfill.outputs.busy }}
    steps:
      - id: backfill
        run: |
          # Any backfill run not completed (queued, waiting, pending, requested, in progress).
          n=$(gh run list --workflow backfill.yml --limit 50 --json status             --jq '[.[] | select(.status != "completed")] | length')
          if [ "$n" -gt 0 ]; then
            echo "::notice::$n backfill run(s) not completed: ingest skipped (polite limit)"
            echo "busy=true" >> "$GITHUB_OUTPUT"
          else
            echo "busy=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  ingest:
    needs: guard
    if: (github.event_name == 'workflow_dispatch' || vars.KEYSTONE_SCHEDULES == 'true') && needs.guard.outputs.busy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120  # a catch-up dispatch (hours=500) parses a few hundred hours
    permissions:
      contents: read
      actions: write  # deletes the older data-cache entries (ADR-089)
      issues: write  # failure issue only
    env:
      KEYSTONE_ACTOR_SALT: ${{ secrets.KEYSTONE_ACTOR_SALT }}
      # 48 h, not 6: GitHub drops scheduled runs under load (16 of 28 ran, 2026-11-10 to 17), and
      # a fixed 6 h window lost every hour a skipped run would have fetched. Hours already parsed
      # are skipped cheaply, so the overlap costs about one conditional request per hour (ADR-088).
      HOURS: ${{ inputs.hours || '48' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Production salt is set
        run: |
          if [ -z "$KEYSTONE_ACTOR_SALT" ]; then
            echo "::error::secret KEYSTONE_ACTOR_SALT is not set (owner sets it in Phase 9)"
            exit 1
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - name: Pipeline run id and window
        run: |
          echo "KEYSTONE_RUN_ID=$(cat /proc/sys/kernel/random/uuid)" >> "$GITHUB_ENV"
          # Exclusive end: the top of the previous hour (the newest file is two hours old).
          end=$(( $(date -u +%s) / 3600 * 3600 - 3600 ))
          start=$(( end - HOURS * 3600 ))
          echo "START=$(date -u -d "@$start" +%Y-%m-%dT%H)" >> "$GITHUB_ENV"
          echo "END=$(date -u -d "@$end" +%Y-%m-%dT%H)" >> "$GITHUB_ENV"
      # Interim store until the Phase 9 storage decision: the data directory (manifest, silver,
      # rollup state, run log) travels between runs in the Actions cache, encrypted (the repo is
      # public and fork PRs can restore base-branch caches; data/ holds salted actor keys).
      - id: data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data-cache
          key: keystone-data-${{ github.run_id }}
          restore-keys: keystone-data-
      - if: steps.data.outputs.cache-matched-key != ''
        run: bash .github/scripts/data-cache.sh unpack
      - run: uv run keystone machine
      - run: uv run keystone ingest gharchive --start "$START" --end "$END"
      - run: uv run keystone ingest gaps --start "$START" --end "$END"
      # Retention (ADR-089): silver hours rolled up by publish and older than 7 whole UTC days
      # leave the cache; their aggregates and name history stay in the rollup file.
      - run: uv run keystone rollup retire --older-than-days 7
      - run: du -sh data/* 2>/dev/null || true  # per directory (du counts nested dirs once)
      - run: bash .github/scripts/data-cache.sh pack
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data-cache
          key: keystone-data-${{ github.run_id }}
      - run: bash .github/scripts/cache-prune.sh 2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - if: failure()
        run: bash .github/scripts/failure-issue.sh
        env:
          GH_TOKEN: ${{ github.token }}
