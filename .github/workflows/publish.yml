name: publish

# Daily publish (Phase 10, ADR-041, ADR-062). Calls only the CLI: the rollup through the profile
# check (no full stack on a runner, so it falls back and records `produced_by: free`), OSV, the
# warehouse, contracts, the score, the metadata export and pipeline_metrics.json, then the site
# exports (every file validated by its JSON Schema) and the weekly brief (skipped without the
# OPENROUTER_API_KEY secret). The exports go to the pre-release `site-data` for the site repo.
# Off until the repository variable KEYSTONE_SCHEDULES is `true`; a manual dispatch always runs.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keystone-data
  cancel-in-progress: false

jobs:
  # Publish needs the data directory the ingest workflow caches. Until a first ingest has run
  # (ingest yields to the backfill, ADR-062), there is nothing to publish: skip with a notice
  # instead of failing (and opening an issue) every day.
  guard:
    if: github.event_name == 'workflow_dispatch' || vars.KEYSTONE_SCHEDULES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      data: ${{ steps.cache.outputs.data }}
    steps:
      - id: cache
        run: |
          # Only main's caches: a scheduled run restores from the default branch.
          n=$(gh cache list --key keystone-data- --ref refs/heads/main --json id --jq length)
          if [ "$n" -gt 0 ]; then
            echo "data=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no ingested data cached yet (ingest has not run): publish skipped"
            echo "data=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  publish:
    needs: guard
    if: (github.event_name == 'workflow_dispatch' || vars.KEYSTONE_SCHEDULES == 'true') && needs.guard.outputs.data == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90  # the first registry fetch took 45 min (ADR-037)
    permissions:
      contents: write  # uploads the exports to the pre-release `site-data`
      issues: write  # failure and fallback issues
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen --all-groups
      - run: echo "KEYSTONE_RUN_ID=$(cat /proc/sys/kernel/random/uuid)" >> "$GITHUB_ENV"
      - id: data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data-cache
          key: keystone-data-${{ github.run_id }}
          restore-keys: keystone-data-
      - if: steps.data.outputs.cache-matched-key != ''
        run: bash .github/scripts/data-cache.sh unpack
        env:
          KEYSTONE_ACTOR_SALT: ${{ secrets.KEYSTONE_ACTOR_SALT }}  # decrypts the data cache
      - name: Ingested data exists
        if: steps.data.outputs.cache-matched-key == ''
        run: |
          echo "::error::no cached data directory; run the ingest workflow first"
          exit 1
      - run: uv run keystone profile check --run
      - run: uv run keystone ingest osv
      - run: uv run keystone parse osv
      # ADR-037 order (ADR-074): models first (the package universe), then the registry claims
      # (ecosyste.ms + npm, polite, refreshed after 7 days, kept in the data cache), then the full
      # build with its tests.
      - run: uv run keystone warehouse build --select "resource_type:seed resource_type:model"
        env:
          DBT_INDIRECT_SELECTION: empty  # models only; the tests run in the full build
      - id: fetch
        run: uv run keystone resolve fetch --max-minutes 35  # resumes next run (ADR-076)
      - run: uv run keystone warehouse build
      - run: uv run keystone quality contracts --require-all
      - run: uv run keystone score live
      - run: uv run keystone score backtest --report data/score/backtest.md
      - run: uv run keystone metadata export --out data/publish/metadata
      - name: Cloud rung stage records (engines[] evidence, ADR-067)
        run: |
          mkdir -p "$RUNNER_TEMP/cloud"
          gh release download cloud-evidence -p 'runs-*.jsonl' -D "$RUNNER_TEMP/cloud"             || echo "no cloud evidence yet"
          shopt -s nullglob
          files=("$RUNNER_TEMP"/cloud/runs-*.jsonl)
          if [ ${#files[@]} -gt 0 ]; then uv run keystone metrics import-runs "${files[@]}"; fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - run: uv run keystone metrics emit --metadata-dir data/publish/metadata
      - run: uv run python -m keystone.export.schemas
      - run: uv run keystone export site --metadata-dir data/publish/metadata
      - name: Weekly brief (free model; skipped without the secret)
        run: uv run keystone narrate brief
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Freshness and producer in the run summary
        run: |
          jq -r '"- freshness: newest hour \(.freshness.newest_data_hour), lag \(.freshness.lag_hours) h, SLO \(.freshness.slo_hours) h: \(.freshness.status)", "- produced_by: \(.produced_by.profile) (fallback \(.produced_by.fallback))"' \
            data/metrics/pipeline_metrics.json >> "$GITHUB_STEP_SUMMARY"
      - name: Fallback issue (opened once, then edited)
        run: bash .github/scripts/fallback-issue.sh data/metrics/pipeline_metrics.json
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload the exports to the pre-release site-data
        run: |
          gh release view site-data >/dev/null 2>&1 || gh release create site-data --prerelease \
            --title "Site data (daily)" \
            --notes "Daily site exports (ADR-060). Repository and package level only; signals, not predictions."
          # Release assets are flat: metadata/catalog.json is published as metadata__catalog.json.
          mkdir -p "$RUNNER_TEMP/site"
          (cd data/publish/site && find . -name '*.json' | sed 's|^\./||') | while read -r f; do
            cp "data/publish/site/$f" "$RUNNER_TEMP/site/${f//\//__}"
          done
          # index.json last, so a reader never sees an index naming files not yet uploaded;
          # then assets no longer in the index are deleted.
          find "$RUNNER_TEMP/site" -name '*.json' ! -name index.json -print0             | xargs -0 gh release upload site-data --clobber
          gh release upload site-data "$RUNNER_TEMP/site/index.json" --clobber
          keep=$(jq -r '.rows[].asset, "index.json"' data/publish/site/index.json)
          gh release view site-data --json assets --jq '.assets[].name' | while read -r a; do
            grep -qxF "$a" <<< "$keep" || gh release delete-asset site-data "$a" --yes
          done
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      # a later failure still banks the fetched claims; never after a failed unpack (ADR-076)
      - if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: bash .github/scripts/data-cache.sh pack
        env:
          KEYSTONE_ACTOR_SALT: ${{ secrets.KEYSTONE_ACTOR_SALT }}  # encrypts the data cache
      - if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data-cache
          key: keystone-data-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-exports
          path: data/publish/site
          retention-days: 7
      - if: failure()
        run: bash .github/scripts/failure-issue.sh
        env:
          GH_TOKEN: ${{ github.token }}
