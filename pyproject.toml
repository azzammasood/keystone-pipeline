[project]
name = "keystone"
version = "0.1.0"
description = "Open-source supply-chain risk radar built on GH Archive."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28",
    "jsonschema>=4.26",
    "openlineage-python>=1.54",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-sdk>=1.45",
    "orjson>=3.13.0",
    "psutil>=6.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "sqlglot>=30.12",
    "typer>=0.12",
]

[project.scripts]
keystone = "keystone.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=8.2",
    "ruff>=0.6",
    "sqlfluff>=3.4",
    "types-jsonschema>=4.26",
    "types-psutil>=6.0",
    "types-pyyaml>=6.0",
]
# dbt-ol needs openlineage-sql, which has no Windows wheel: on Windows `keystone lineage dbt`
# runs it in a Linux container (lineage/dbt.py).
lineage = [
    "openlineage-dbt>=1.54; sys_platform == 'linux'",
]
metadata = [
    "acryl-datahub[datahub-business-glossary,datahub-rest,dbt,iceberg,kafka]>=1.7",
]
quality = [
    "datacontract-cli[duckdb,parquet]>=1.2.7",
    "great-expectations>=1.5",
]
streaming = [
    "confluent-kafka>=2.6",
    "fastavro>=1.9",
]
warehouse = [
    "dbt-core>=1.10",
    "dbt-duckdb>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keystone"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH"]

[tool.ruff.lint.per-file-ignores]
"src/keystone/cli.py" = ["B008"]
"src/keystone/bench/cli.py" = ["B008"]
"src/keystone/profile/cli.py" = ["B008"]  # Typer options as defaults
"src/keystone/score/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # third-party deprecations inside datacontract-cli (ibis) and great-expectations
    "ignore::DeprecationWarning:ibis.*",
    "ignore::DeprecationWarning:pydantic.v1.*",
]
markers = [
    "network: talks to a real host; skipped unless KEYSTONE_NETWORK_TESTS=1",
]
