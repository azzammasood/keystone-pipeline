[project]
name = "keystone"
version = "0.1.0"
description = "Open-source supply-chain risk radar built on GH Archive."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28",
    "jsonschema>=4.26",
    "openlineage-python>=1.55.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-sdk>=1.45",
    "orjson>=3.13.0",
    "psutil>=6.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pytz>=2026.6",
    "pyyaml>=6.0",
    "sqlglot>=30.12",
    "typer>=0.12",
]

[project.scripts]
keystone = "keystone.cli:app"

[dependency-groups]
databricks = [
    "dbt-databricks>=1.10",
    "oauthlib>=4.0.1",  # PYSEC-2026-4114, CVE-2026-49272 (via databricks-sql-connector)
]
dev = [
    "mypy>=2.4.1",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "sqlfluff>=4.5.0",
    "types-jsonschema>=4.26",
    "types-psutil>=7.2.2.20261111",
    "types-pyyaml>=6.0.12.20261113",
]
# dbt-ol needs openlineage-sql, which has no Windows wheel: on Windows `keystone lineage dbt`
# runs it in a Linux container (lineage/dbt.py).
lineage = [
    "openlineage-dbt>=1.55.0; sys_platform == 'linux'",
]
metadata = [
    "acryl-datahub[datahub-business-glossary,datahub-rest,dbt,iceberg,kafka]>=1.7.0.20",
]
quality = [
    "datacontract-cli[duckdb,parquet]>=1.2.10",
    "great-expectations>=1.25.0",
]
streaming = [
    "confluent-kafka>=2.16.1",
    "fastavro>=1.9",
]
warehouse = [
    "dbt-core>=1.12.7",
    "dbt-duckdb>=1.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keystone"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH"]

[tool.ruff.lint.per-file-ignores]
"src/keystone/cli.py" = ["B008"]
"src/keystone/bench/cli.py" = ["B008"]
"src/keystone/backfill/cli.py" = ["B008"]
"src/keystone/profile/cli.py" = ["B008"]  # Typer options as defaults
"src/keystone/score/cli.py" = ["B008"]
"src/keystone/export/cli.py" = ["B008"]
"src/keystone/narrate/cli.py" = ["B008"]
"src/keystone/cloud/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # third-party deprecations inside datacontract-cli (ibis) and great-expectations
    "ignore::DeprecationWarning:ibis.*",
    "ignore::DeprecationWarning:pydantic.v1.*",
]
markers = [
    "network: talks to a real host; skipped unless KEYSTONE_NETWORK_TESTS=1",
]
