# Backtest incidents and the GH Archive history each needs (Phase 9, ADR-039, ADR-050).
# Owner decision 2026-10-22 (minimum data): download only `lookback_months` before each incident
# plus the live score's trailing window; nothing else. A window runs from the first day of the
# incident month minus `lookback_months` to the end of the incident month, so any point-in-time
# cut inside that month has a full year behind it; the exact cut date belongs to the backtest.
lookback_months: 12
incidents:
  - id: event-stream
    month: 2018-11
  - id: colors-faker
    month: 2022-01
  - id: xz
    month: 2024-03
live:
  # The live score uses the same features as the backtest, so the same lookback: from the first
  # day of the month 12 months back to today.
  trailing_months: 12
