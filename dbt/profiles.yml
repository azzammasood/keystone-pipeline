# Paths come from `keystone warehouse build`, which sets them from --root (absolute).
keystone:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('KEYSTONE_WAREHOUSE_PATH') }}"
      threads: 2
      settings:
        TimeZone: UTC  # timestamptz -> date and hour cuts are UTC, as everywhere else
      attach:
        - path: "{{ env_var('KEYSTONE_ROLLUP_PATH') }}"
          alias: rollup
          read_only: true
    # Databricks Free Edition, Unity Catalog (ADR-067): `keystone cloud databricks run` sets the
    # host and http_path; the token comes from the environment (an Actions secret).
    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'workspace') }}"
      schema: keystone
      threads: 2
