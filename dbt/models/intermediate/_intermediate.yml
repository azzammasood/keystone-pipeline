version: 2

models:
  - name: int_repo_name_hours
    description: One row per repository id, name and UTC hour with activity under that name.
    data_tests:
      - unique_combination:
          arguments:
            columns: [repo_id, repo_name, seen_hour]
    columns:
      - name: repo_id
        description: GitHub repository id.
        data_tests: [not_null]
      - name: repo_name
        description: Name seen in the hour.
      - name: seen_hour
        description: UTC hour.
      - name: first_seen_at
        description: First event under the name in the hour.
      - name: last_seen_at
        description: Last event under the name in the hour.
      - name: era_min
        description: Earliest schema era among those events.
      - name: era_max
        description: Latest schema era among those events.
      - name: events
        description: Events in the hour under the name.
  - name: int_package_repo_evidence
    description: >
      Each OSV pointer from a package to a repository, with how many packages the record names.
    columns:
      - name: package_key
        description: ecosystem/package_name.
      - name: repo_host
        description: Repository host.
      - name: repo_full_name
        description: owner/name in lower case.
      - name: kind
        description: git_range or fix_reference.
      - name: vuln_id
        description: OSV record giving the evidence.
      - name: packages_in_vuln
        description: Distinct packages named by that record.
  - name: int_package_universe
    description: >
      Packages Phase 7 resolves, one row per normalised key: OSV packages and the ecosyste.ms
      critical sets. Packages with malware reports only are kept as scope osv_malware_only.
    columns:
      - name: package_key
        description: ecosystem/name normalised (PEP 503 for PyPI).
        data_tests: [unique, not_null]
      - name: ecosystem
        description: Ecosystem in OSV spelling.
      - name: package_name
        description: Name as the registry or OSV spells it.
      - name: in_osv
        description: The package has OSV records.
      - name: osv_spellings
        description: OSV spellings that normalise to this key (dim_package rows).
      - name: critical
        description: ecosyste.ms flags the package critical.
      - name: package_scope
        description: critical, osv (has a non-malware advisory), osv_malware_only or registry_only.
        data_tests:
          - accepted_values:
              arguments:
                values: [critical, osv, osv_malware_only, registry_only]
  - name: int_package_repo_claims
    description: One row per package, source and named repository (OSV, ecosyste.ms, npm registry).
    columns:
      - name: package_key
        description: ecosystem/name normalised.
        data_tests: [not_null]
      - name: source
        description: osv_git_range, osv_fix_sole, osv_fix_shared, ecosystems or npm_registry.
        data_tests:
          - accepted_values:
              arguments:
                values: [osv_git_range, osv_fix_sole, osv_fix_shared, ecosystems, npm_registry]
      - name: repo_host
        description: github.com, gitlab.com or bitbucket.org.
      - name: repo_full_name
        description: owner/name in lower case, as the claim names it.
      - name: in_subpath
        description: The claim names a directory inside the repository (monorepo).
      - name: ecosystems_repo_id
        description: GitHub id ecosyste.ms resolved the URL to (ecosystems claims only).
      - name: evidence
        description: OSV records giving the claim (1 for registry claims).
  - name: int_repo_identity
    description: The GitHub repository id each claimed github.com name means today, with the rule used.
    columns:
      - name: repo_name_lower
        description: Claimed owner/name in lower case.
        data_tests: [unique, not_null]
      - name: repo_id
        description: Resolved GitHub repository id, or null.
      - name: id_rule
        description: >
          ecosystems_current, ecosystems_previous_name, gharchive_unique_name,
          gharchive_latest_holder, ambiguous or not_seen.
        data_tests:
          - accepted_values:
              arguments:
                values: [ecosystems_current, ecosystems_previous_name, gharchive_unique_name,
                         gharchive_latest_holder, ambiguous, not_seen]
      - name: current_name
        description: Current owner/name of the resolved id (ecosyste.ms, else GH Archive).
      - name: seen_in_gharchive
        description: The resolved id appears in the loaded GH Archive data.
      - name: gharchive_ids
        description: Distinct ids GH Archive saw with the name.
      - name: gharchive_disagrees
        description: GH Archive's latest holder of the name is another id than the resolved one.
