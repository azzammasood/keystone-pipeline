version: 2

# Published layer (tag `publish`): copied to the Iceberg namespace `marts` by
# `keystone warehouse publish`. Repository and package facts only; no person keys.
models:
  - name: dim_repo
    description: One row per GitHub repository id seen in GH Archive, with its current name.
    columns:
      - name: repo_id
        description: GitHub repository id.
        data_tests: [unique, not_null]
      - name: repo_name
        description: Current name, the latest name spell in dim_repo_name_history.
        data_tests: [not_null]
      - name: repo_name_lower
        description: Current name in lower case (GitHub names are case-insensitive).
      - name: distinct_names
        description: Distinct names (case-insensitive) the id has carried.
      - name: name_spells
        description: Name spells in the history (a name taken again counts again; case changes do not).
      - name: first_seen_at
        description: First event of the repository, UTC.
      - name: last_seen_at
        description: Last event of the repository, UTC.
      - name: first_era
        description: Earliest schema era with an event.
      - name: last_era
        description: Latest schema era with an event.
      - name: events
        description: Events with a repository id (all eras in the loaded data).
  - name: dim_repo_name_history
    description: >
      Name history per repository id: one row per uninterrupted spell of a name (compared
      case-insensitively), ordered by first sighting. valid_to is the first sighting of the
      next spell; old and new names can interleave within an hour, so last_seen_at may pass
      valid_to by less than an hour.
    data_tests:
      - unique_combination:
          arguments:
            columns: [repo_id, name_seq]
    columns:
      - name: repo_id
        description: GitHub repository id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_repo')
                field: repo_id
      - name: name_seq
        description: Spell number within the repository, from 1.
      - name: repo_name
        description: Name during the spell, spelled as at its latest sighting.
      - name: repo_name_lower
        description: Name in lower case.
      - name: valid_from
        description: First event under the name in the spell, UTC.
      - name: valid_to
        description: First event of the next spell, UTC; null for the current spell.
      - name: last_seen_at
        description: Last event under the name in the spell, UTC.
      - name: first_era
        description: Earliest schema era in the spell.
      - name: last_era
        description: Latest schema era in the spell.
      - name: events
        description: Events in the spell.
      - name: is_current
        description: True for the latest spell.
  - name: dim_package
    description: One row per package named in OSV (ecosystem and name as OSV spells them).
    columns:
      - name: package_key
        description: ecosystem/package_name.
        data_tests: [unique, not_null]
      - name: ecosystem
        description: OSV ecosystem.
      - name: package_name
        description: Package name.
      - name: purl
        description: A package URL from OSV, if any.
      - name: vuln_count
        description: OSV records naming the package.
      - name: malicious_vuln_count
        description: Of those, malicious-package reports.
      - name: withdrawn_vuln_count
        description: Of those, withdrawn records.
      - name: first_vuln_published_at
        description: Earliest publication time among those records, UTC.
      - name: last_vuln_modified_at
        description: Latest modification time among those records, UTC.
  - name: bridge_package_repo
    description: >
      Package-to-repository candidates from OSV evidence. Confidence is a rule (high: GIT range
      of the package; medium: FIX reference in a record about this package only; low: FIX
      reference in a record about several packages). repo_id is set only when exactly one
      GitHub repository id ever carried the name in the loaded data.
    data_tests:
      - unique_combination:
          arguments:
            columns: [package_key, repo_host, repo_full_name]
    columns:
      - name: package_key
        description: ecosystem/package_name.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_package')
                field: package_key
      - name: repo_host
        description: github.com, gitlab.com or bitbucket.org.
      - name: repo_full_name
        description: owner/name in lower case, as the evidence names it.
      - name: repo_id
        description: Matched GitHub repository id, or null (see repo_match).
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_repo')
                field: repo_id
      - name: repo_match
        description: unique_name, ambiguous_name, not_seen (no event in the loaded data) or not_github.
        data_tests:
          - accepted_values:
              arguments:
                values: [unique_name, ambiguous_name, not_seen, not_github]
      - name: confidence
        description: high, medium or low (rule above).
        data_tests:
          - accepted_values:
              arguments:
                values: [high, medium, low]
      - name: evidence_vulns
        description: OSV records giving evidence for the pair.
      - name: mapping_source
        description: Where the evidence comes from (osv).
  - name: fct_vuln
    description: One row per OSV record and affected package.
    data_tests:
      - unique_combination:
          arguments:
            columns: [vuln_id, package_key]
    columns:
      - name: vuln_id
        description: OSV id.
        data_tests: [not_null]
      - name: package_key
        description: ecosystem/package_name.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_package')
                field: package_key
      - name: ecosystem
        description: OSV ecosystem.
      - name: package_name
        description: Package name.
      - name: published_at
        description: Publication time, UTC.
      - name: modified_at
        description: Last modification time, UTC.
      - name: withdrawn_at
        description: Withdrawal time, UTC; null when not withdrawn.
      - name: is_malicious
        description: True for malicious-package reports.
      - name: severity_label
        description: Database severity label, if given.
      - name: cvss_v3_vector
        description: CVSS v3 vector, if given.
      - name: cvss_v4_vector
        description: CVSS v4 vector, if given.
      - name: has_fixed
        description: True when any range for the package names a fix.
      - name: alias_count
        description: Number of aliases of the record.
      - name: source_file
        description: Lineage, the OSV zip.
      - name: source_sha256
        description: Lineage, SHA-256 of the zip.
      - name: fetched_at
        description: Lineage, fetch time of the zip (UTC).
  - name: fct_repo_day
    description: >
      Daily activity per repository (UTC day), schema era and completeness period. Era and
      period are keys, so a day crossing a boundary has a row per side.
    data_tests:
      - unique_combination:
          arguments:
            columns: [activity_date, repo_id, era, completeness_period]
    columns:
      - name: activity_date
        description: UTC day.
        data_tests: [not_null]
      - name: repo_id
        description: GitHub repository id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_repo')
                field: repo_id
      - name: era
        description: Schema era.
        data_tests:
          - accepted_values:
              arguments:
                values: [E0, E1, E2, E3]
      - name: completeness_period
        description: Completeness period.
        data_tests: [not_null]
      - name: events
        description: All events.
      - name: human_events
        description: Events by actors not flagged as bots.
      - name: pushes
        description: PushEvents.
      - name: prs_opened
        description: Pull requests opened.
      - name: prs_closed
        description: Pull requests closed (merged or not).
      - name: prs_merged
        description: Closed pull requests marked merged (E1, E2 only).
      - name: pr_merge_known
        description: Closed pull requests whose merged flag is present.
      - name: issues_opened
        description: Issues opened.
      - name: issues_closed
        description: Issues closed.
      - name: issue_comments
        description: IssueCommentEvents.
      - name: releases_published
        description: Releases published.
      - name: members_added
        description: Collaborators added (MemberEvent added).
      - name: stars
        description: WatchEvents (stars).
      - name: forks
        description: ForkEvents.
      - name: fetched_at_max
        description: Newest fetch time of the source files (lineage).
  - name: map_package_repo
    description: >
      Package to repository mapping (Phase 7, ADR-037): one row per package and candidate
      repository with status (auto_exact, accepted, suggested, rejected), the rule that decided
      it and a confidence. Only exact matches (two independent sources, no rival) are
      auto_exact; ambiguous cases follow documented rules; suggested rows go to the review CSV.
    data_tests:
      - unique_combination:
          arguments:
            columns: [package_key, repo_key]
    columns:
      - name: package_key
        description: ecosystem/name normalised (PEP 503 for PyPI).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_package_universe')
                field: package_key
      - name: ecosystem
        description: Ecosystem in OSV spelling.
      - name: package_name
        description: Package name as the registry or OSV spells it.
      - name: scope
        description: critical, osv, osv_malware_only or registry_only (int_package_universe).
      - name: repo_key
        description: Candidate key, github.com#<id> when the GitHub id is known, else host/owner/name.
        data_tests: [not_null]
      - name: repo_host
        description: github.com, gitlab.com or bitbucket.org.
      - name: repo_full_name
        description: Current owner/name in lower case (renames followed when the id is known).
      - name: repo_id
        description: GitHub repository id, or null when it is not known.
      - name: repo_id_rule
        description: How the id was found (int_repo_identity.id_rule).
      - name: seen_in_gharchive
        description: The repository id appears in the loaded GH Archive data.
      - name: claimed_names
        description: Distinct names the claims used for this repository (more than 1 after a rename).
      - name: by_ecosystems
        description: ecosyste.ms names this repository.
      - name: by_npm_registry
        description: The npm registry `repository` field names it.
      - name: by_osv_git_range
        description: An OSV GIT range of the package names it.
      - name: by_osv_fix_sole
        description: A FIX reference in an OSV record about this package only names it.
      - name: by_osv_fix_shared
        description: A FIX reference in an OSV record about several packages names it.
      - name: in_subpath
        description: A claim names a directory inside the repository (monorepo package).
      - name: osv_evidence_vulns
        description: OSV records giving evidence for this candidate.
      - name: independent_sources
        description: >
          Independent source families naming it (0 to 2): the registry (npm registry field or
          ecosyste.ms, which derives from it) and an OSV GIT range.
      - name: candidates
        description: Candidate repositories of the package.
      - name: status
        description: auto_exact, accepted, suggested or rejected.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [auto_exact, accepted, suggested, rejected]
      - name: rule
        description: The documented rule that set the status (see the model's header and ADR-037).
        data_tests:
          - accepted_values:
              arguments:
                values: [review, sources_agree, contested, single_source, single_source_unverified,
                         most_sources, llm, tie, outvoted, fix_reference_only]
      - name: confidence
        description: high, medium or low, fixed per rule.
        data_tests:
          - accepted_values:
              arguments:
                values: [high, medium, low]
      - name: decided_by
        description: rules, review (resolve_decisions seed) or llm.
      - name: llm_confidence
        description: The model's stated confidence when the rule is llm.
  - name: dim_repo_rename
    description: >
      Repository renames: one row per id and name change, from GH Archive (the id under
      consecutive names: auto_exact) and ecosyste.ms previous names (accepted when GH Archive
      did not see the change).
    data_tests:
      - unique_combination:
          arguments:
            columns: [repo_id, from_name, to_name, renamed_before]
    columns:
      - name: repo_id
        description: GitHub repository id.
        data_tests: [not_null]
      - name: from_name
        description: Name before the change (owner/name, lower case).
      - name: to_name
        description: Name after the change.
      - name: renamed_after
        description: Last GH Archive sighting of the old name (UTC); null for ecosyste.ms rows.
      - name: renamed_before
        description: First GH Archive sighting of the new name (UTC); null for ecosyste.ms rows.
      - name: by_gharchive
        description: GH Archive shows the change.
      - name: by_ecosystems
        description: ecosyste.ms lists from_name as a previous name of the id.
      - name: status
        description: auto_exact or accepted.
        data_tests:
          - accepted_values:
              arguments:
                values: [auto_exact, accepted]
      - name: rule
        description: same_id_new_name (GH Archive) or ecosystems_previous_name.
      - name: confidence
        description: high or medium.
  - name: map_repo_name_id
    description: >
      GH Archive events with a repository name but no id (E1 2012, some E0), resolved by name:
      one row per name and UTC hour with the chosen id, status, rule and confidence.
    data_tests:
      - unique_combination:
          arguments:
            columns: [repo_name_lower, event_hour]
    columns:
      - name: repo_name_lower
        description: owner/name in lower case.
        data_tests: [not_null]
      - name: event_hour
        description: UTC hour of the events.
      - name: era
        description: Schema era of the events (E0 or E1).
      - name: events
        description: Events of that name and hour without an id.
      - name: repo_id
        description: Chosen GitHub repository id (nearest candidate for suggested rows).
      - name: id_existed
        description: The chosen id is no larger than an id seen in an event before the hour.
      - name: candidate_ids
        description: Ids GH Archive saw with the name.
      - name: gap_hours
        description: Hours between the events and the chosen id's nearest spell of the name (0 inside it).
      - name: status
        description: auto_exact, accepted, suggested or rejected.
        data_tests:
          - accepted_values:
              arguments:
                values: [auto_exact, accepted, suggested, rejected]
      - name: rule
        description: >
          review, spell_covers, unique_name_near, unique_name_id_existed, unique_name_far or
          several_ids (see the model's header and ADR-037).
        data_tests:
          - accepted_values:
              arguments:
                values: [review, spell_covers, unique_name_near, unique_name_id_existed,
                         unique_name_far, several_ids]
      - name: confidence
        description: high, medium or low.
