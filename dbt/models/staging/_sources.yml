version: 2

# Silver Parquet (Phase 3, parse) and the free rollup engine's DuckDB file (Phase 4). The
# DuckDB target reads silver files in place; another target maps the same names to its tables.
sources:
  - name: silver
    description: Typed silver Parquet written by `keystone parse` (lineage columns on every row).
    # On Databricks the runner stages each source as a Unity Catalog table (ADR-067).
    schema: "{{ 'keystone_src' if target.type == 'databricks' else 'silver' }}"
    meta:
      root: "{{ env_var('KEYSTONE_DATA_ROOT') }}"
    tables:
      - name: gharchive_events
        description: One row per GH Archive event; repository-level facts and salted keys only.
        meta:
          external_location: "read_parquet('{{ env_var('KEYSTONE_DATA_ROOT') }}/silver/gharchive/events/*/*.parquet', hive_partitioning = false)"
      - name: osv_vulns
        description: One row per OSV record (no free text, no credits).
        meta:
          external_location: "read_parquet('{{ env_var('KEYSTONE_DATA_ROOT') }}/silver/osv/vulns/*.parquet')"
      - name: osv_affected
        description: One row per OSV `affected[]` entry with a package.
        meta:
          external_location: "read_parquet('{{ env_var('KEYSTONE_DATA_ROOT') }}/silver/osv/affected/*.parquet')"
      - name: osv_repo_refs
        description: Repository pointers in OSV records (GIT ranges and FIX references).
        meta:
          external_location: "read_parquet('{{ env_var('KEYSTONE_DATA_ROOT') }}/silver/osv/repo_refs/*.parquet')"
      - name: registry_packages
        description: >
          Registry claims per package and source (`keystone resolve fetch`): ecosyste.ms bulk
          lookups and the npm registry `repository` field; allow-listed fields and lineage.
        meta:
          external_location: "read_parquet('{{ env_var('KEYSTONE_DATA_ROOT') }}/silver/registry/packages/*.parquet', union_by_name = true)"
      - name: registry_repo_names
        description: Current and previous names of GitHub repositories, per ecosyste.ms.
        meta:
          external_location: "read_parquet('{{ env_var('KEYSTONE_DATA_ROOT') }}/silver/registry/repo_names/*.parquet', union_by_name = true)"
      - name: resolve_llm_choices
        description: >
          Answers of the language-model rung (`keystone resolve choose`), validated against the
          listed candidates; empty while the rung is skipped (no key).
        meta:
          external_location: "read_parquet('{{ env_var('KEYSTONE_DATA_ROOT') }}/silver/resolve/llm_choices/*.parquet', union_by_name = true)"
  - name: rollup
    description: Rollup tables of the free engine (`keystone rollup run`), attached read-only.
    database: "{{ target.database if target.type == 'databricks' else 'rollup' }}"
    schema: "{{ 'keystone_src' if target.type == 'databricks' else 'main' }}"
    tables:
      - name: repo_hour
        description: Activity per repository, era and event type in UTC hours (ADR-024).
